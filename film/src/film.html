<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Halo · Launch film</title>
<link rel="stylesheet" href="../../src/styles/fonts.css">
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="../../src/styles/base.css">
<link rel="stylesheet" href="../../src/styles/components.css">
<link rel="stylesheet" href="../../src/styles/misc.css">
<link rel="stylesheet" href="../../src/styles/screens/home.css">
<link rel="stylesheet" href="../../src/styles/screens/digest.css">
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; }
  html, body { margin: 0; background: #F7F7F5; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F7F7F5; font-family: var(--font-sans); color: #0A0A0A; }
  body[data-format="vertical"] #stage { width: 1080px; height: 1920px; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }
  .dark { background: #0F1114; color: #F2F2EF; }
  .canvas { background: #F7F7F5; }
  .cap { font: 600 84px/1.04 var(--font-sans); letter-spacing: -0.045em; text-wrap: balance; }
  .cap-md { font: 600 64px/1.06 var(--font-sans); letter-spacing: -0.04em; }
  .sub { font: 400 30px/1.4 var(--font-sans); letter-spacing: -0.012em; color: #4B4B47; }
  .mono { font-family: var(--font-mono); letter-spacing: 0; }
  .w { display: inline-block; white-space: pre; }
  .notif { width: 600px; display: flex; gap: 18px; align-items: flex-start; padding: 22px 24px; border-radius: 20px; background: #1A1D22; box-shadow: 0 0 0 1px #2A2E35, 0 30px 60px -30px rgba(0,0,0,.8); color: #F2F2EF; }
  .notif .brand-tile { background: #F7F7F5; box-shadow: none; }
  .notif-t { font: 600 22px/1.25 var(--font-sans); letter-spacing: -0.01em; }
  .notif-b { font: 400 21px/1.4 var(--font-sans); color: #B8B9B5; margin-top: 6px; }
  .notif-time { margin-left: auto; font: 500 16px/1 var(--font-mono); color: #6E7076; padding-top: 4px; }
  .scaled { transform-origin: 0 0; }
  .lbl { font: 500 20px/1 var(--font-sans); color: #6B6B66; text-align: center; margin-top: 14px; }
  .line-sv { position: absolute; inset: 0; pointer-events: none; }
  .pill { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 22px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px #E6E6E1; font: 500 22px/1 var(--font-sans); color: #4B4B47; }
  .dotx { width: 10px; height: 10px; border-radius: 50%; background: #FF4405; display: inline-block; }
  .cursor { position: absolute; width: 34px; height: 34px; z-index: 50; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
  .dialbox { width: 360px; padding: 36px; border-radius: 28px; background: #fff; box-shadow: 0 0 0 1px #E6E6E1; text-align: left; }
  .dialbox.on { box-shadow: 0 0 0 3px #0A0A0A; }
  .dialbox h4 { font: 600 34px/1 var(--font-sans); letter-spacing: -0.025em; margin-top: 28px; }
  .dialbox p { font: 400 22px/1.4 var(--font-sans); color: #6B6B66; margin-top: 10px; }
  .row-st { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px #E6E6E1; font: 400 21px/1.35 var(--font-sans); }
  .ok { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #E6F3EC; color: #12744A; flex: none; }
  .subrow { display: flex; align-items: center; gap: 16px; padding: 14px 4px; border-top: 1px solid #ECECE8; font: 400 22px/1.3 var(--font-sans); }
  .est { margin-left: auto; font: 500 18px/1 var(--font-sans); font-variant-numeric: tabular-nums; color: #4B4B47; padding: 8px 12px; border-radius: 10px; background: #F1F1EE; }
</style>
</head>
<body data-format="wide">
<div id="stage"></div>
<script src="../../src/js/core/util.js"></script>
<script src="../../src/js/core/icons.js"></script>
<script src="../../src/js/core/brands.js"></script>
<script src="../../src/js/core/ui.js"></script>
<script src="../../src/js/core/data.js"></script>
<script src="assets.js"></script>
<script src="film.js"></script>
</body>
</html>
