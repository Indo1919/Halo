        '<div class="cal-ticket-title">' + esc(t.title) + "</div>" +
        '<div class="cal-ticket-meta">' + esc(t.origin) + "</div></div>").join("")
        : '<div class="muted-note" style="padding:6px 2px;color:var(--faint)">—</div>') +
      "</div></div>";
  }).join("");

  return '<section class="screen active">' +
    '<div class="page-header"><h1 class="page-title">Ticket Calendar</h1>' +
    '<p class="page-sub">Everything Halo has drafted or you\'ve accepted, laid out by due date. A calm week view — no ticket ever surprises you.</p></div>' +
    '<div class="cal-toolbar"><div class="cal-toolbar-left">' +
      '<button class="btn sm ghost">' + ic("prev") + 'Prev</button><div class="cal-range">Aug 4 – Aug 8, 2026</div>' +
      '<button class="btn sm ghost">Next' + ic("next", "trail") + '</button><button class="btn sm">Today</button></div>' +
      '<div class="cal-toolbar-right"><div class="cal-legend">' +
        '<span class="cal-legend-item"><span class="cal-dot design"></span>Design</span>' +
        '<span class="cal-legend-item"><span class="cal-dot backend"></span>Coordination</span>' +
        '<span class="cal-legend-item"><span class="cal-dot question"></span>Open Q</span></div></div></div>' +
    '<div class="cal-week">' + week + "</div>" +
    (later.length ? '<div class="cal-footnote">' + later.length + " ticket" + (later.length === 1 ? "" : "s") +
      " scheduled beyond this week: " + later.map(t => esc(t.title)).join(", ") + ".</div>" : "") +
    "</section>";
};

/* ============================== TICKETS ============================== */
function progressOf(t) {
  if (!t.subtasks.length) return t.status === "done" ? 100 : t.status === "progress" ? 40 : 0;
  return Math.round(100 * t.subtasks.filter(s => s.done).length / t.subtasks.length);
}
const STATUS_LABEL = { todo: "To do", progress: "In progress", blocked: "Blocked", done: "Done" };

function ticketRow(t) {
  const p = progressOf(t);
  const te = ticketEstimate(t);
  const overdue = t.due === "Today" && t.status !== "done";
  return '<div class="ticket-list-row' + (t.status === "done" ? " completed" : "") + '" data-ticket="' + t.id + '">' +
    '<div class="ticket-checkbox' + (t.status === "done" ? " on" : "") + '" data-toggle-ticket="' + t.id + '"></div>' +
    '<div class="ticket-list-content"><div class="ticket-list-title">' + esc(t.title) + "</div>" +
    '<div class="ticket-list-meta"><span class="ticket-tag' + (t.warn ? " warn" : "") + '">' + esc(t.tag) + "</span>" +
      "<span>" + esc(t.origin) + "</span>" +
      (t.subtasks.length ? '<span>· ' + t.subtasks.filter(s => s.done).length + "/" + t.subtasks.length + " subtasks</span>" +
        '<span class="progress-mini"><span class="progress-mini-fill" style="width:' + p + '%"></span></span>' : "") +
    "</div></div>" +
    '<div class="est-chip" data-estimate="t:' + t.id + '" title="Estimate — click to open the calculator">' +
      (te.hours ? "≈ " + fmtH(te.hours) : "+ est") + "</div>" +
    '<div class="ticket-list-due' + (overdue ? " overdue" : t.status === "done" ? " done" : "") + '">' + esc(t.due) + "</div></div>";
}

function ticketList() {
  const tab = S.ticketTab;
  const active = S.tickets.filter(t => t.status !== "done");
  const done = S.tickets.filter(t => t.status === "done");
  const shown = tab === "active" ? active : tab === "completed" ? done : S.tickets;

  let body = "";
  if (!shown.length) {
    body = '<div class="empty"><div class="empty-icon">' + ICON.ticket + "</div>" +
      '<div class="empty-title">Nothing here</div><p class="empty-text">No tickets in this view yet.</p></div>';
  } else if (tab === "active") {
    const groups = [["Due today", t => t.due === "Today"], ["This week", t => /Aug 7|Aug 8/.test(t.due)], ["Next week", t => /Aug 11/.test(t.due)]];
    groups.forEach(([label, fn]) => {
      const g = shown.filter(fn);
      if (g.length) body += '<div class="tickets-group-label">' + label + "</div>" + g.map(ticketRow).join("");
    });
    const rest = shown.filter(t => !/Today|Aug 7|Aug 8|Aug 11/.test(t.due));
    if (rest.length) body += '<div class="tickets-group-label">Later</div>' + rest.map(ticketRow).join("");
  } else {
    body = '<div class="tickets-group-label">' + (tab === "completed" ? "Completed this week" : "All tickets") + "</div>" + shown.map(ticketRow).join("");
  }

  return '<section class="screen active">' +
    '<div class="page-header"><h1 class="page-title">Tickets</h1>' +
    '<p class="page-sub">Everything on your plate, Halo-generated and kept current. Open one to break it down — check one off to hear it land.</p></div>' +
    '<div class="tickets-toolbar"><div class="tickets-tabs">' +
      '<div class="tickets-tab' + (tab === "active" ? " active" : "") + '" data-ttab="active">Active <span class="tickets-tab-count">' + active.length + "</span></div>" +
      '<div class="tickets-tab' + (tab === "completed" ? " active" : "") + '" data-ttab="completed">Completed <span class="tickets-tab-count">' + done.length + "</span></div>" +
      '<div class="tickets-tab' + (tab === "all" ? " active" : "") + '" data-ttab="all">All <span class="tickets-tab-count">' + S.tickets.length + "</span></div>" +
    "</div>" +
    '<div class="tickets-toolbar-right"><button class="btn sm gold" data-new-ticket="1">' + ic("plus") + "New ticket</button></div></div>" +
    (tab === "active" ? capacityCard() : "") +
    body + "</section>";
}

function ticketDetail(t) {
  const p = progressOf(t);
  const est = ticketEstimate(t);
  const done = t.subtasks.filter(s => s.done).length;

  const subs = t.subtasks.map(s => {
    const who = s.who ? person(s.who) : null;
    return '<div class="subtask-row' + (s.done ? " done" : "") + '">' +
      '<div class="ticket-checkbox' + (s.done ? " on" : "") + '" data-sub="' + t.id + ":" + s.id + '"></div>' +
      '<div class="subtask-name" contenteditable="true" data-rename-sub="' + t.id + ":" + s.id + '">' + esc(s.name) + "</div>" +
      '<div class="est-chip sm" data-estimate="s:' + t.id + ":" + s.id + '" title="Estimate">' +
        (s.est ? fmtH(s.est) : "+ est") + "</div>" +
      '<div class="subtask-due" data-sub-due="' + t.id + ":" + s.id + '">' + esc(s.due || "No date") + "</div>" +
      (who ? '<div class="subtask-assign ' + who.av + '" data-sub-who="' + t.id + ":" + s.id + '" title="' + esc(who.name) + '">' + who.initials + "</div>"
           : '<div class="subtask-assign unassigned" data-sub-who="' + t.id + ":" + s.id + '" title="Unassigned">+</div>') +
      '<span class="subtask-del" data-del-sub="' + t.id + ":" + s.id + '">' + ic("x", "solo") + "</span></div>";
  }).join("");

  const assignee = person(t.assignee);

  return '<section class="screen active">' +
    '<div class="detail-back" data-close-ticket="1">' + ICON.back + " All tickets</div>" +
    '<div class="detail-layout"><div>' +
      '<div class="card"><div class="detail-title-row">' +
        '<h1 class="detail-title" contenteditable="true" data-rename-ticket="' + t.id + '">' + esc(t.title) + "</h1></div>" +
        '<div class="detail-sub">' + esc(t.origin) + " · created Wed 10:58</div>" +
        '<div class="detail-desc">' + esc(t.desc) + "</div>" +
        '<div class="progress-head"><span class="progress-label">Progress</span>' +
          '<span class="progress-count">' + (t.subtasks.length ? done + " of " + t.subtasks.length + " subtasks" : STATUS_LABEL[t.status]) + " · " + p + "%</span></div>" +
        '<div class="progress-track"><div class="progress-fill' + (p === 100 ? " done" : "") + '" style="width:' + p + '%"></div></div>' +
        estimateBlock(t) +
      "</div>" +

      '<div class="card mt-16"><div class="card-header"><h3 class="card-title">Subtasks</h3>' +
        '<button class="btn ghost sm" data-halo-split="' + t.id + '">' + ic("spark") + "Let Halo break this down</button></div>" +
        (subs || '<p class="muted-note" style="margin:0 0 6px">No subtasks yet. Add one below, or let Halo split it for you.</p>') +
        '<div class="subtask-add">' + ICON.plus.replace("<svg", '<svg style="width:15px;height:15px;color:var(--muted-2)"') +
        '<input id="new-sub" placeholder="Add a subtask and press Enter — Halo estimates it for you" data-add-sub="' + t.id + '" /></div>' +
      "</div>" +

      '<div class="card mt-16"><div class="card-header"><h3 class="card-title">How Halo will report this</h3></div>' +
        '<div class="digest-item-preview" style="margin:0">' +
          '<div class="digest-preview-label">If someone asks about this ticket:</div>“' +
          esc(ticketVoiceLine(t)) + "”</div>" +
        '<p class="muted-note" style="margin:12px 0 0">Completing this ticket drafts an update for your ' +
          (S.mode === "ambient" ? "activity log — it will publish automatically." : "digest — you decide whether it goes out.") + "</p>" +
      "</div>" +
    "</div><div>" +

      '<div class="card"><div class="card-header"><h3 class="card-title">Details</h3></div>' +
        '<div class="meta-row"><span class="meta-key">Status</span>' +
          '<span class="meta-val" data-status="' + t.id + '"><span class="status-pill ' + t.status + '">' + STATUS_LABEL[t.status] + "</span></span></div>" +
        '<div class="meta-row"><span class="meta-key">Assignee</span>' +
          '<span class="meta-val" data-assign="' + t.id + '"><span class="menu-avatar ' + assignee.av + '">' + assignee.initials + "</span>" +
          esc(assignee.name.split(" ")[0]) + "</span></div>" +
        '<div class="meta-row"><span class="meta-key">Estimate</span>' +
          '<span class="meta-val" data-estimate="t:' + t.id + '">' + (est.hours ? fmtH(est.hours) : "Add estimate") +
          (est.rolled ? '<span class="muted-note" style="font-weight:400"> · rolled up</span>' : "") + "</span></div>" +
        '<div class="meta-row"><span class="meta-key">Logged</span>' +
          '<span style="font-size:12.5px;color:var(--ink-2);font-weight:600">' + fmtH(ticketSpent(t)) + "</span></div>" +
        '<div class="meta-row"><span class="meta-key">Due</span>' +
          '<span class="meta-val" data-due="' + t.id + '">' + esc(t.due) + "</span></div>" +
        '<div class="meta-row"><span class="meta-key">Priority</span>' +
          '<span class="meta-val" data-prio="' + t.id + '"><span class="prio-pill ' + t.prio + '">' +
          ({ high: "High", med: "Medium", low: "Low" })[t.prio] + "</span></span></div>" +
        '<div class="meta-row"><span class="meta-key">Source</span><span style="font-size:12.5px;color:var(--ink-2)">' + esc(t.origin) + "</span></div>" +
      "</div>" +

      '<div class="card mt-16"><div class="card-header"><h3 class="card-title">Trail</h3></div>' +
        t.trail.map(x => '<div class="trail-item"><span class="trail-bullet"></span><div><strong>' + esc(x.t) + "</strong><br>" + esc(x.m) + "</div></div>").join("") +
      "</div>" +

      '<div class="card mt-16"><div class="card-header"><h3 class="card-title">Actions</h3></div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          '<button class="btn sm" data-toggle-ticket="' + t.id + '">' + (t.status === "done" ? "Reopen ticket" : "✓ Mark complete") + "</button>" +
          '<button class="btn sm ghost" data-book="' + (t.subtasks.find(s => s.who && s.who !== "matias") || {}).who + '">Book time on this</button>' +
          '<button class="btn sm ghost" data-del-ticket="' + t.id + '">Delete ticket</button>' +
        "</div></div>" +
    "</div></div></section>";
}

function ticketVoiceLine(t) {
  const p = progressOf(t);
  if (t.status === "done") return "Finished — " + t.title.charAt(0).toLowerCase() + t.title.slice(1) + ". Off my plate.";
  if (t.status === "blocked") return "Still on " + t.title.charAt(0).toLowerCase() + t.title.slice(1) + " — it's blocked, not forgotten. " + (t.subtasks.length ? p + "% of the breakdown is done." : "");
  if (p > 0) return "Mid-way through " + t.title.charAt(0).toLowerCase() + t.title.slice(1) + " — " + p + "% of the subtasks are closed, due " + t.due.toLowerCase() + ".";
  return "Picking up " + t.title.charAt(0).toLowerCase() + t.title.slice(1) + " — due " + t.due.toLowerCase() + ".";
}

SCREENS["tickets"] = function () {
  const t = S.openTicket && S.tickets.find(x => x.id === S.openTicket);
  return t ? ticketDetail(t) : ticketList();
};

};

/* ==================================================================
   Estimation — three-point (PERT) estimates Halo proposes from your
   own history, rolled up from subtasks, checked against capacity.

   Competitor grounding:
   · Jira      — original estimate vs time spent, compared to refine later
   · Linear    — estimates roll up and feed cycle/project statistics
   · ClickUp   — workload capacity measured in hours against a work schedule
   · PERT      — expected = (optimistic + 4×likely + pessimistic) / 6
   ================================================================== */

/* Baseline hours for a "medium" task of each kind, before your pace is applied */
const EST_BASE = {
  Design: 3, Research: 2.5, Writing: 2, Analysis: 2, Build: 3.5, Scoping: 1.5,
  Review: 1, Coordination: 1, "Open question": 0.75, Manual: 1.5, Other: 2
};
const SIZE_MULT = { S: 0.5, M: 1, L: 2 };
const SIZE_LABEL = { S: "Small", M: "Medium", L: "Large" };

/* What your finished work actually took — Halo's reference class */
const EST_HISTORY = [
  { tag: "Design", title: "Checkout card layout", est: 3, actual: 4 },
  { tag: "Design", title: "Pin icon set v3", est: 2, actual: 2.5 },
  { tag: "Design", title: "Empty states pass", est: 4, actual: 5 },
  { tag: "Research", title: "Interview script v2", est: 2, actual: 1.75 },
  { tag: "Research", title: "Funnel drop-off audit", est: 3, actual: 3.25 },
  { tag: "Writing", title: "Concept brief", est: 4, actual: 5.5 },
  { tag: "Coordination", title: "Fever kickoff prep", est: 1, actual: 0.75 },
  { tag: "Open question", title: "Confirm auth scope", est: 0.5, actual: 1.5 }
];

function round25(h) { return Math.max(0.25, Math.round(h * 4) / 4); }

function fmtH(h) {
  if (h == null) return "—";
  if (h < 1) return Math.round(h * 60) + "m";
  const whole = Math.floor(h), min = Math.round((h - whole) * 60);
  return min ? whole + "h " + min + "m" : whole + "h";
}

/* How far off you historically run on this kind of work (1.0 = spot on) */
function paceFactor(tag) {
  const rows = EST_HISTORY.filter(r => r.tag === tag);
  if (!rows.length) return 1.15;
  const est = rows.reduce((n, r) => n + r.est, 0), act = rows.reduce((n, r) => n + r.actual, 0);
  return Math.round((act / est) * 100) / 100;
}

/* Halo's proposal for a piece of work: a range, not a false-precision number */
function proposeEstimate(tag, size, reviews) {
  const base = EST_BASE[tag] || EST_BASE.Other;
  const pace = paceFactor(tag);
  const mult = SIZE_MULT[size || "M"];
  const likely = base * mult * pace + (reviews || 0) * 0.5;
  const low = likely * 0.7, high = likely * 1.6;
  const pert = (low + 4 * likely + high) / 6;
  const rows = EST_HISTORY.filter(r => r.tag === tag);
  return {
    low: round25(low), likely: round25(likely), high: round25(high), pert: round25(pert),
    pace, samples: rows.length,
    basis: [
      "Base for " + (tag || "work") + ": " + fmtH(base) + " at medium size",
      SIZE_LABEL[size || "M"] + " scope · ×" + mult,
      rows.length
        ? "Your last " + rows.length + " " + tag + " task" + (rows.length === 1 ? "" : "s") + " ran " +
          (pace >= 1 ? Math.round((pace - 1) * 100) + "% over" : Math.round((1 - pace) * 100) + "% under") + " estimate · ×" + pace
        : "No history for this kind of work yet · ×1.15 default",
      (reviews || 0) ? (reviews + " review round" + (reviews === 1 ? "" : "s") + " · +" + fmtH(reviews * 0.5)) : "No review rounds budgeted"
    ]
  };
}

/* A ticket's estimate rolls up from its subtasks when it has them (Jira/Linear) */
function ticketEstimate(t) {
  if (t.subtasks.length) {
    const sum = t.subtasks.reduce((n, s) => n + (s.est || 0), 0);
    if (sum > 0) return { hours: sum, rolled: true, count: t.subtasks.length };
  }
  return { hours: t.est || 0, rolled: false, count: 0 };
}
function ticketSpent(t) {
  return (t.spent || 0) + t.subtasks.reduce((n, s) => n + (s.done ? (s.est || 0) * (s.overrun || 1) : 0), 0);
}
function ticketRemaining(t) {
  const e = ticketEstimate(t).hours;
  if (!t.subtasks.length) return t.status === "done" ? 0 : e;
  return t.subtasks.filter(s => !s.done).reduce((n, s) => n + (s.est || 0), 0);
}

/* ---------------- Capacity: estimates vs the day you actually have ---------------- */
const WORKDAY_HOURS = 8;

function capacityToday() {
  const meetingHours = S.schedule.filter(e => !e.focus).length * 0.75;
  const focusHours = S.schedule.filter(e => e.focus).length * 1.5;
  const free = Math.max(0, WORKDAY_HOURS - meetingHours);
  const due = S.tickets.filter(t => t.status !== "done" && (t.due === "Today" || t.status === "progress"));
  const load = due.reduce((n, t) => n + ticketRemaining(t), 0);
  const over = load - free;
  return {
    free: Math.round(free * 4) / 4, load: Math.round(load * 4) / 4, over: Math.round(over * 4) / 4,
    meetings: S.schedule.filter(e => !e.focus).length, meetingHours, focusHours, count: due.length,
    pct: free > 0 ? Math.min(140, Math.round(100 * load / free)) : 0,
    verdict: load === 0 ? "clear" : over > 0.5 ? "over" : over > -1 ? "full" : "room"
  };
}

function capacityLine() {
  const c = capacityToday();
  if (c.verdict === "clear") return "Nothing in flight. Your calendar has " + fmtH(c.free) + " free.";
  if (c.verdict === "over") return fmtH(c.load) + " of work in flight against " + fmtH(c.free) +
    " free after meetings — over by " + fmtH(c.over) + ". Something moves, or something slips.";
  if (c.verdict === "full") return fmtH(c.load) + " in flight against " + fmtH(c.free) + " free. Tight but doable.";
  return fmtH(c.load) + " in flight against " + fmtH(c.free) + " free — room for one more thing.";
}

function capacityCard() {
  const c = capacityToday();
  const tone = c.verdict === "over" ? "over" : c.verdict === "full" ? "full" : "ok";
  return '<div class="cap-card ' + tone + '">' +
    '<div class="cap-top"><div><div class="cap-title">Today\'s load</div>' +
      '<div class="cap-sub">' + esc(capacityLine()) + "</div></div>" +
      '<div class="cap-figure">' + fmtH(c.load) + '<span class="cap-figure-sub">/ ' + fmtH(c.free) + " free</span></div></div>" +
    '<div class="cap-bar"><span style="width:' + Math.min(100, c.pct) + '%"></span>' +
      (c.pct > 100 ? '<em style="width:' + Math.min(40, c.pct - 100) + '%"></em>' : "") + "</div>" +
    '<div class="cap-legend"><span>' + c.count + " ticket" + (c.count === 1 ? "" : "s") + " due today</span>" +
      "<span>" + c.meetings + " meeting" + (c.meetings === 1 ? "" : "s") + " · " + fmtH(c.meetingHours) + "</span>" +
      '<span>Halo tells people you\'re ' + (c.verdict === "over" ? "at capacity" : c.verdict === "full" ? "booked but reachable" : "open") + "</span></div>" +
    "</div>";
}

/* Work out what size an existing estimate implies, so re-estimating stays honest */
function inferSize(tag, hours) {
  if (!hours) return "M";
  const medium = (EST_BASE[tag] || EST_BASE.Other) * paceFactor(tag);
  const ratio = hours / medium;
  return ratio < 0.75 ? "S" : ratio > 1.5 ? "L" : "M";
}

/* ---------------- The calculator ---------------- */
function openEstimator(kind, tid, sid) {
  const t = findTicket(tid);
  if (kind === "ticket" && t.subtasks.length) return openRollup(t);
  const target = kind === "sub" ? t.subtasks.find(s => s.id === sid) : t;
  const tag = kind === "sub" ? (t.tag || "Other") : (t.tag || "Other");
  const size = target.size || "M";
  const reviews = target.reviews || 0;

  const body = function (sz, rv) {
    const p = proposeEstimate(tag, sz, rv);
    return '<div class="est-live"><div class="est-live-num">' + fmtH(p.pert) + "</div>" +
        '<div class="est-live-range">likely ' + fmtH(p.likely) + " · range " + fmtH(p.low) + "–" + fmtH(p.high) + "</div>" +
        '<div class="est-live-note">Three-point estimate: (best + 4×likely + worst) ÷ 6</div></div>' +
      '<div class="field"><span class="field-label">How big is it?</span><div class="seg" id="est-size">' +
        ["S", "M", "L"].map(k => '<div class="seg-opt' + (k === sz ? " active" : "") + '" data-est-size="' + k + '">' + SIZE_LABEL[k] + "</div>").join("") +
      "</div></div>" +
      '<div class="field"><span class="field-label">Review rounds to budget for</span><div class="seg" id="est-rev">' +
        [0, 1, 2].map(k => '<div class="seg-opt' + (k === rv ? " active" : "") + '" data-est-rev="' + k + '">' + (k === 0 ? "None" : k + "×") + "</div>").join("") +
      "</div></div>" +
      '<div class="est-basis"><div class="est-basis-label">How Halo got there</div>' +
        p.basis.map(b => '<div class="est-basis-row"><span class="trail-bullet"></span>' + esc(b) + "</div>").join("") +
      "</div>";
  };

  modal({
    title: "Estimate · " + (kind === "sub" ? target.name : target.title),
    sub: "Halo estimates from what your own finished work actually took — not a guess, and not a number you have to invent.",
    body: '<div id="est-wrap">' + body(size, reviews) + "</div>",
    ok: "Use this estimate",
    onOk: () => {
      const p = proposeEstimate(tag, S.estDraft.size, S.estDraft.reviews);
      target.est = p.pert; target.size = S.estDraft.size; target.reviews = S.estDraft.reviews;
      target.estBy = "halo";
      closeOverlay(); renderAll();
      toast("<strong>" + fmtH(p.pert) + " estimated.</strong> " +
        (kind === "sub" ? "Rolled into the ticket total." : "Halo will flag it if today's load stops fitting."));
    }
  });

  S.estDraft = { size, reviews, kind, tid, sid, tag, redraw: () => { $("#est-wrap").innerHTML = body(S.estDraft.size, S.estDraft.reviews); } };
}

/* Estimate vs logged, shown under the ticket's progress bar */
function estimateBlock(t) {
  const est = ticketEstimate(t), spent = ticketSpent(t), remain = ticketRemaining(t);
  if (!est.hours) {
    return '<div class="est-block empty" data-estimate="t:' + t.id + '">' + ic("clock") +
      "No estimate yet — let Halo size it from your finished work.</div>";
  }
  const pct = Math.min(100, Math.round(100 * spent / est.hours));
  const over = spent > est.hours;
  const pace = paceFactor(t.tag || "Other");
  return '<div class="est-block">' +
    '<div class="est-block-head"><span class="est-block-label">Estimate</span>' +
      '<span class="est-block-val">' + fmtH(est.hours) +
      (est.rolled ? ' <span class="muted-note">rolled up from ' + est.count + " subtasks</span>" : "") + "</span>" +
      '<span class="est-block-val alt">' + fmtH(spent) + " logged · " + fmtH(remain) + " left</span></div>" +
    '<div class="est-track"><span style="width:' + pct + '%" class="' + (over ? "over" : "") + '"></span></div>' +
    '<div class="est-note">' + (over
      ? "Past the estimate. Halo will use this to size the next one."
      : pace > 1.05
        ? "Heads up — your " + (t.tag || "similar") + " work usually runs about " + Math.round((pace - 1) * 100) + "% over."
        : "You tend to land close on this kind of work.") +
    '<span class="est-open" data-estimate="t:' + t.id + '">Open calculator</span></div>' +
  "</div>";
}


/* A parent ticket's number is the sum of its children — so estimate the children */
function openRollup(t) {
  const est = ticketEstimate(t);
  const rows = t.subtasks.map(s =>
    '<div class="est-basis-row" style="padding:7px 0"><span class="trail-bullet"></span>' +
    '<span style="flex:1">' + esc(s.name) + "</span>" +
    '<span class="est-chip sm" data-estimate="s:' + t.id + ":" + s.id + '">' + (s.est ? fmtH(s.est) : "+ est") + "</span></div>").join("");

  modal({
    title: "Estimate · " + t.title,
    sub: "This ticket has subtasks, so its estimate is the sum of theirs — the same way Jira and Linear roll a parent up. Estimate a subtask to change the total.",
    body: '<div class="est-live"><div class="est-live-num">' + fmtH(est.hours) + "</div>" +
        '<div class="est-live-range">rolled up from ' + est.count + " subtask" + (est.count === 1 ? "" : "s") + " · " +
        fmtH(ticketRemaining(t)) + " left</div></div>" +
      '<div class="est-basis"><div class="est-basis-label">Breakdown</div>' + rows + "</div>" +
      '<p class="muted-note" style="margin:14px 0 0">Halo sizes each one from what your finished ' +
      esc((t.tag || "similar").toLowerCase()) + " work actually took, then adds your usual overrun.</p>",
    ok: "Re-estimate all with Halo", cancel: "Done",
    onOk: () => {
      t.subtasks.forEach(s => {
        const size = s.size || inferSize(t.tag || "Other", s.est);
        const p = proposeEstimate(t.tag || "Other", size, s.reviews || 0);
        s.est = p.pert; s.size = size; s.estBy = "halo";
      });
      closeOverlay(); renderAll();
      toast("<strong>" + fmtH(ticketEstimate(t).hours) + " total.</strong> Every subtask re-sized from your own history.");
    }
  });
}

    "</div></div>";

function tourGo(i) {
  clearTimeout(S.tour.timer);
  if (i >= TOUR.length) return tourEnd();
  S.tour.i = Math.max(0, i);
  renderStage();
  if (S.tour.playing) tourSchedule(TOUR_MS);
}
function tourSchedule(ms) {
  S.tour.started = Date.now(); S.tour.left = ms;
  clearTimeout(S.tour.timer);
  S.tour.timer = setTimeout(() => tourGo(S.tour.i + 1), ms);
}
function tourToggle() {
  S.tour.playing = !S.tour.playing;
  if (S.tour.playing) tourSchedule(S.tour.left || TOUR_MS);
  else { clearTimeout(S.tour.timer); S.tour.left = Math.max(600, S.tour.left - (Date.now() - S.tour.started)); }
  renderStage();
}
function tourEnd() {
  clearTimeout(S.tour.timer);
  S.stage = "outro";
  renderStage();
}

/* ---------------- Stage router ---------------- */
function renderStage() {
  const root = $("#onboarding-root");
  document.body.classList.toggle("onboarding", S.stage !== "app");
  if (S.stage === "app") { root.innerHTML = ""; return; }
  root.innerHTML =
    S.stage === "splash" ? renderSplash() :
    S.stage === "tour"   ? renderTour() :
    S.stage === "outro"  ? renderOutro() : renderFlow();
  if (S.stage === "setup" && flowKey() === "voice" && S.voiceLearned) bindDials();
}

function enterApp(msg) {
  clearTimeout(S.tour.timer);
  S.stage = "app";
  renderStage();
  renderAll();
  if (msg !== false) setTimeout(() => toast(msg || "<strong>Halo is on.</strong> It'll start filling in as you work — nothing publishes that you haven't allowed.",
    { label: "See what it says", fn: () => go("my-halo") }), 400);
}

function startTour() {
  S.stage = "tour"; S.tour.i = 0; S.tour.playing = true;
  renderStage(); tourSchedule(TOUR_MS);
}

/* ------------------------- Trust spectrum ------------------------- */
function setMode(m) {
  closeOverlay();
  if (!MODES[m] || m === S.mode) { if (MODES[m]) renderAll(); return; }
  const prev = S.mode;
  S.mode = m;
  S.digest.forEach(d => { d.locked = false; });      // re-evaluate everything under the new rules
  applyMode(true);
  applyRules();
  renderAll();

  const msg = m === "ambient"
    ? "<strong>Ambient.</strong> " + S.digest.filter(d => d.state === "published").length +
      " updates published on their own. Anything flagged as venting or sensitive still never goes out — it's logged instead."
    : m === "balanced"
      ? "<strong>Balanced.</strong> " + S.digest.filter(d => d.state === "auto").length + " routine updates published automatically; " + pendingCount() + " held for you."
      : "<strong>Curated.</strong> Nothing publishes without you — all " + pendingCount() + " updates are waiting in your digest.";
  toast(msg, m !== prev ? { label: "Open digest", fn: () => go(m === "ambient" ? "activity" : "digest") } : null);
  logActivity("sys", "Trust mode changed to <em>" + MODES[m].name + "</em>.", "You · Voice & Privacy");
}

/* Category rules override the mode for specific categories */
function applyRules() {
  S.digest.forEach(d => {
    if (d.locked) return;
    const r = S.rules[d.cat] || "mode";
    if (r === "hold") d.state = S.mode === "ambient" ? "dropped" : "held";
    if (r === "auto" && S.mode !== "curated" && inBatch(d)) d.state = "auto";
  });
}

/* ------------------------- Digest actions ------------------------- */
function decide(id, state) {
  const d = S.digest.find(x => x.id === id);
  if (!d) return;
  d.state = d.state === state ? "pending" : state;
  d.locked = d.state !== "pending";
  renderAll();
}

function publishApproved() {
  const approved = S.digest.filter(d => d.state === "approved");
  const held = S.digest.filter(d => d.state === "held");
  if (!approved.length && !held.length) return toast("Nothing decided yet — approve or hold an item first.");
  approved.forEach(d => {
    d.state = "published"; d.locked = true;
    logActivity("pub", "Published <em>“" + d.text.slice(0, 72) + (d.text.length > 72 ? "…" : "") + "”</em>", d.src + " · you approved it");
  });
  held.forEach(d => { d.state = "dropped"; d.locked = true; });
  renderAll();
  toast("<strong>" + approved.length + " update" + (approved.length === 1 ? "" : "s") + " published.</strong> " +
    (held.length ? held.length + " held — nobody sees " + (held.length === 1 ? "it" : "them") + ". " : "") +
    "Your Halo summary just changed.", { label: "See My Halo", fn: () => go("my-halo") });
}

function unpublish(id) {
  const d = S.digest.find(x => x.id === id);
  if (!d) return;
  d.state = "dropped"; d.locked = true;
  renderAll();
  toast("Pulled back. Anyone who saw it has been notified of the correction.", { label: "Undo", fn: () => { d.state = "published"; renderAll(); } });
  logActivity("hold", "Pulled back <em>“" + d.text.slice(0, 60) + "…”</em>", "You · correction sent");
}

function bulk(kind) {
  const pending = S.digest.filter(inBatch);
  if (kind === "held") {
    pending.forEach(d => { d.state = "dropped"; d.locked = true; });
    renderAll();
    toast("<strong>All held.</strong> Halo won't share any of today's batch.");
  } else {
    pending.forEach(d => { if (d.cat !== "flagged") d.state = "approved"; });
    publishApproved();
  }
}

/* ------------------------- Tickets ------------------------- */
function findTicket(id) { return S.tickets.find(t => t.id === id); }

function toggleTicket(id) {
  const t = findTicket(id); if (!t) return;
  const wasDone = t.status === "done";
  t.status = wasDone ? (t.subtasks.some(s => s.done) ? "progress" : "todo") : "done";
  if (!wasDone) {
    t.subtasks.forEach(s => { s.done = true; });
    chime(true);
    draftFromTicket(t);
  } else chime(false);
  renderAll();
}

function draftFromTicket(t) {
  const item = {
    id: uid("d"), cat: "ticket", tag: "TICKET UPDATE", src: "Halo · ticket completed", conf: "high",
    routine: true, sensitive: false, text: ticketVoiceLine(t),
    hero: "closed out " + t.title.charAt(0).toLowerCase() + t.title.slice(1), heroExec: "",
    aud: { team: true, manager: true, exec: false }, locked: false,
    state: S.mode === "curated" ? "pending" : S.mode === "balanced" ? "auto" : "published"
  };
  S.digest.unshift(item);
  if (item.state !== "pending") logActivity("pub", "Published <em>“" + item.text + "”</em>", "Ticket completed · automatic");
  toast("<strong>Done.</strong> " + (item.state === "pending"
    ? "Halo drafted an update for your digest."
    : "Halo published the update automatically."),
    { label: item.state === "pending" ? "Review it" : "See it", fn: () => go(item.state === "pending" ? "digest" : (S.mode === "ambient" ? "activity" : "digest")) });
}

function toggleSubtask(tid, sid) {
  const t = findTicket(tid); if (!t) return;
  const s = t.subtasks.find(x => x.id === sid); if (!s) return;
  s.done = !s.done;
  if (s.done) chime(true);
  const all = t.subtasks.length && t.subtasks.every(x => x.done);
  if (all && t.status !== "done") { t.status = "done"; draftFromTicket(t); }
  else if (!all && t.status === "done") t.status = "progress";
  else if (t.subtasks.some(x => x.done) && t.status === "todo") t.status = "progress";
  renderAll();
}

function addSubtask(tid, name) {
  const t = findTicket(tid); if (!t) return;
  t.subtasks.push({ id: uid("s"), name, done: false, who: "matias", due: t.due.split(",")[0],
                    est: proposeEstimate(t.tag || "Other", "S", 0).pert, size: "S", estBy: "halo" });
  if (t.status === "done") t.status = "progress";
  renderAll();
  const inp = $("#new-sub"); if (inp) inp.focus();
}

function haloSplit(tid) {
  const t = findTicket(tid); if (!t) return;
  const base = t.title.toLowerCase();
  const gen = [
    { n: "Pull together what already exists on " + base.split(" ").slice(-2).join(" "), who: "matias" },
    { n: "Draft the first version", who: "matias" },
    { n: "Get one round of review before it goes wide", who: "alex" }
  ];
  const existing = t.subtasks.map(s => s.name.toLowerCase());
  let added = 0;
  gen.forEach(g => {
    if (!existing.includes(g.n.toLowerCase())) {
      t.subtasks.push({ id: uid("s"), name: g.n, done: false, who: g.who, due: t.due.split(",")[0],
                        est: proposeEstimate(t.tag || "Other", "M", 0).pert, size: "M", estBy: "halo" });
      added++;
    }
  });
  if (t.status === "todo") t.status = "progress";
  renderAll();
  toast("<strong>Halo split it into " + added + " subtasks</strong> and estimated each one — " +
    fmtH(ticketEstimate(t).hours) + " total. Rename, reassign, or re-estimate any of them.");
}

/* ------------------------- Voice dials ------------------------- */
function bindDials() {
  $$(".dial-slider").forEach(sl => {
    const key = sl.dataset.dial;
    const set = e => {
      const r = sl.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, Math.round(((e.clientX - r.left) / r.width) * 100)));
      S.dials[key] = pct;
      $(".dial-fill", sl).style.width = pct + "%";
      $(".dial-thumb", sl).style.left = pct + "%";
      const prev = $("#voice-preview"); if (prev) prev.textContent = composeHero(S.voiceAud);
    };
    sl.addEventListener("mousedown", e => {
      set(e);
      const move = ev => set(ev);
      const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
    });
  });
}

/* ------------------------- Global click delegation ------------------------- */
document.addEventListener("click", e => {
  const t = e.target;
  const hit = sel => t.closest("[" + sel + "]");
  let el;

  /* onboarding */
  if (hit("data-ob-skip")) return enterApp(false);
  if ((el = hit("data-ob"))) {
    const v = el.dataset.ob;
    if (v === "tour" || v === "tour-restart") return startTour();
    if (v === "setup") { clearTimeout(S.tour.timer); S.stage = "setup"; S.flow = 0; return renderStage(); }
  }
  if ((el = hit("data-tour"))) {
    const v = el.dataset.tour;
    if (v === "toggle") return tourToggle();
    if (v === "next") { S.tour.left = TOUR_MS; return tourGo(S.tour.i + 1); }
    if (v === "prev") { S.tour.left = TOUR_MS; return tourGo(S.tour.i - 1); }
  }
  if ((el = hit("data-setup-mode"))) { S.mode = el.dataset.setupMode; S.digest.forEach(d => { d.locked = false; }); applyMode(true); applyRules(); return renderStage(); }
  if ((el = hit("data-auth"))) {
    const v = el.dataset.auth;
    if (v === "email") {
      const val = $("#auth-email") ? $("#auth-email").value.trim() : "";
      if (!val || val.indexOf("@") < 0) return toast("Enter an email address to continue.");
      S.auth.email = val;
    }
    S.auth.busy = true; renderStage();
    return setTimeout(() => { S.auth.busy = false; flowGo(1); }, 1100);
  }
  if ((el = hit("data-flow-jump"))) { const n = +el.dataset.flowJump; if (n <= S.flow) return flowGo(n); return; }
  if ((el = hit("data-flow"))) {
    const v = el.dataset.flow;
    if (v === "finish") {
      return enterApp("<strong>Halo is on.</strong> " + MODES[S.mode].name + " mode, " +
        S.sources.reduce((n, c) => n + c.items.filter(i => i.on).length, 0) + " sources connected. Nothing publishes that you haven't allowed.");
    }
    if (v === "back") { if (S.flow === 0) { S.stage = "splash"; return renderStage(); } return flowGo(S.flow - 1); }
    /* capture whatever the current screen collects before moving on */
    const k = flowKey();
    if (k === "profile") {
      S.profile.name = ($("#pf-name").value || S.profile.name).trim();
      S.profile.role = ($("#pf-role").value || S.profile.role).trim();
      S.profile.team = $("#pf-team").value;
      ME.name = S.profile.name; ME.first = S.profile.name.split(" ")[0];
      ME.role = S.profile.role + " · Jetzy";
      ME.initials = S.profile.name.split(" ").map(x => x.charAt(0)).join("").slice(0, 2).toUpperCase();
      const chip = $(".user-name"), role = $(".user-role"), av = $(".user-avatar");
      if (chip) chip.textContent = ME.first + " " + (S.profile.name.split(" ")[1] || "").charAt(0) + ".";
      if (role) role.textContent = ME.role;
      if (av) av.textContent = ME.initials;
    }
    if (k === "invite" && el.classList.contains("ghost")) S.invites = [];
    return flowGo(S.flow + 1);
  }
  if ((el = hit("data-reach"))) { S.profile.reach = el.dataset.reach; return renderStage(); }
  if (hit("data-privacy-toggle")) { S.privacy = !S.privacy; return renderStage(); }
  if (hit("data-ns-add")) {
    const v = $("#ns-input").value.trim();
    if (v) { S.neverShare.push(v); $("#ns-input").value = ""; renderStage(); }
    return;
  }
  if ((el = hit("data-ns-quick"))) { S.neverShare.push(el.dataset.nsQuick); return renderStage(); }
  if (hit("data-invite-add")) {
    const v = $("#inv-input").value.trim();
    if (!v || v.indexOf("@") < 0) return toast("That doesn't look like an email address.");
    S.invites.push(v); return renderStage();
  }
  if ((el = hit("data-invite-del"))) { S.invites.splice(+el.dataset.inviteDel, 1); return renderStage(); }

  if ((el = hit("data-gs"))) {
    const v = el.dataset.gs;
    if (v === "dismiss") { S.checklist.dismissed = true; return renderAll(); }
    const [k, dest] = v.split(":");
    S.checklist[k] = true; return go(dest);
  }

  /* navigation */
  if ((el = hit("data-go"))) return go(el.dataset.go);
  if ((el = hit("data-ticket"))) return go("tickets", { ticket: el.dataset.ticket });
  if (hit("data-close-ticket")) { S.openTicket = null; return renderAll(); }

  /* mode + simulation — info icon must win over its parent mode card */
  if ((el = hit("data-mode-info"))) { e.stopPropagation(); const k = el.dataset.modeInfo;
    return modal({ title: MODES[k].name + " mode", sub: MODES[k].scale,
      body: '<p style="font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0 0 14px">' + MODES[k].banner.replace(/<\/?strong>/g, "") + "</p>" +
        '<div class="mode-meter"><div class="mode-meter-fill" style="width:' + MODES[k].meter + '%"></div></div>',
      ok: "Switch to " + MODES[k].name, onOk: () => { closeOverlay(); setMode(k); } }); }
  if ((el = hit("data-mode"))) return setMode(el.dataset.mode);
  if (hit("data-sim")) return simulateQuery();
  if (hit("data-toggle-why")) { $("#why-wrap").classList.toggle("why-open"); return; }
  if (hit("data-post-standup")) {
    const su = standupAnswer();
    const text = "Since yesterday: " + su.yesterday.join("; ") + ". Today: " + su.today.join("; ") + ". " +
      (su.blocked.length ? "Blocked: " + su.blocked.join("; ") + "." : "Nothing blocked.");
    const item = { id: uid("d"), cat: "meeting", tag: "STANDUP", src: "Halo · composed from your tickets", conf: "high",
      routine: true, sensitive: false, text, hero: "", heroExec: "",
      aud: { team: true, manager: true, exec: false }, locked: true,
      state: S.mode === "curated" ? "pending" : "published" };
    S.digest.unshift(item);
    if (item.state === "published") logActivity("pub", "Posted your standup to <em>#standup</em> — composed from tickets, not typed.", "Halo · standup replacement");
    renderAll();
    return toast(item.state === "pending"
      ? "<strong>Standup drafted.</strong> Curated mode holds it for your approval first."
      : "<strong>Posted to #standup.</strong> That's the 9am meeting, gone.",
      { label: item.state === "pending" ? "Review it" : "See it", fn: () => go(item.state === "pending" ? "digest" : (S.mode === "ambient" ? "activity" : "digest")) });
  }
  if ((el = hit("data-deflect"))) {
    const pid = el.dataset.deflect;
    S.chatPerson = pid; S.chat = [];
    go("ask");
    setTimeout(() => sendChat(S.book.agenda || bookAgenda(pid)), 120);
    return;
  }

  /* digest */
  if ((el = hit("data-decide"))) { const [id, st] = el.dataset.decide.split(":"); return decide(id, st); }
  if ((el = hit("data-edit"))) { S.editing = el.dataset.edit; return renderAll(); }
  if (hit("data-cancel-edit")) { S.editing = null; return renderAll(); }
  if ((el = hit("data-save-edit"))) {
    const id = el.dataset.saveEdit, d = S.digest.find(x => x.id === id);
    if (d) { d.text = $("#edit-" + id).value.trim() || d.text; d.edited = true; }
    S.editing = null; renderAll();
    return toast("<strong>Edited.</strong> Halo will use your wording, not its own.");
  }
  if ((el = hit("data-aud-toggle"))) {
    const [id, k] = el.dataset.audToggle.split(":");
    const d = S.digest.find(x => x.id === id); if (d) { d.aud[k] = !d.aud[k]; renderAll(); }
    return;
  }
  if ((el = hit("data-bulk"))) return bulk(el.dataset.bulk);
  if (hit("data-publish")) return publishApproved();
  if (hit("data-save-later")) { renderAll(); return toast("Saved. Your decisions stay put — nothing published."); }
  if ((el = hit("data-unpublish"))) return unpublish(el.dataset.unpublish);
  if (hit("data-toggle-autopub")) { $("#autopub").classList.toggle("open"); return; }

  /* activity + history corrections */
  if ((el = hit("data-correct"))) {
    const a = S.activity.find(x => x.id === el.dataset.correct); if (!a) return;
    return modal({ title: "Correct this", sub: "Halo will replace what it said and notify anyone who saw the original.",
      body: '<div class="field"><span class="field-label">What Halo said</span>' +
        '<textarea class="field-textarea" id="corr">' + a.text.replace(/<[^>]+>/g, "") + "</textarea></div>",
      ok: "Send correction",
      onOk: () => { a.text = esc($("#corr").value); a.meta = "Corrected by you · " + nowLabel(); closeOverlay(); renderAll();
        toast("<strong>Correction sent.</strong> Everyone who saw the original was notified."); } });
  }
  if ((el = hit("data-correct-history"))) {
    const h = S.history.find(x => x.id === el.dataset.correctHistory); if (!h) return;
    return modal({ title: "Correct this answer", sub: "Halo told " + h.who + ": “" + h.q + "”",
      body: '<div class="field"><span class="field-label">Replace with</span><textarea class="field-textarea" id="corr">' + esc(h.a) + "</textarea></div>",
      ok: "Send correction",
      onOk: () => { h.a = $("#corr").value; h.corrected = true; h.src = ["Corrected by you"]; closeOverlay(); renderAll();
        toast("<strong>Correction sent.</strong> " + h.who.split(" ")[0] + " was notified."); } });
  }

  /* audience switches */
  if ((el = hit("data-aud"))) {
    const group = el.closest("[data-aud-group]").dataset.audGroup;
    if (group === "hero") S.heroAud = el.dataset.aud; else S.voiceAud = el.dataset.aud;
    return renderAll();
  }

  /* team + ask + book */
  if ((el = hit("data-team"))) { S.teamFilter = el.dataset.team; return renderAll(); }
  if ((el = hit("data-ask"))) { S.chatPerson = el.dataset.ask; S.chat = []; return go("ask"); }
  if ((el = hit("data-suggest"))) return sendChat(el.dataset.suggest);
  if ((el = hit("data-book"))) {
    const id = el.dataset.book;
    if (!id || id === "undefined") return toast("Nobody else is assigned on this one yet.");
    S.book.person = id; S.book.agenda = ""; S.book.slot = null; return go("book");
  }
  if ((el = hit("data-slot"))) { S.book.slot = el.dataset.slot; return renderAll(); }
  if ((el = hit("data-dur"))) { S.book.duration = +el.dataset.dur; return renderAll(); }
  if (hit("data-book-send")) {
    if (!S.book.slot) return toast("Pick a time first — gold ones are when Halo thinks they'd welcome it.");
    const p = person(S.book.person), [day, time] = S.book.slot.split("|");
    S.schedule.push({ time: time.length === 4 ? "0" + time : time, title: S.book.duration + " min with " + p.name.split(" ")[0], meta: "Requested · " + day, focus: false });
    logActivity("pub", "Sent a booking request to <strong>" + esc(p.name) + "</strong> for " + esc(day) + " at " + esc(time) + ".", "You · Book Time");
    toast("<strong>Request sent.</strong> " + p.name.split(" ")[0] + " gets your agenda with it — no blind invite.",
      { label: "See schedule", fn: () => go("my-halo") });
    S.book.slot = null; return renderAll();
  }

  /* tickets */
  if ((el = hit("data-toggle-ticket"))) { e.stopPropagation(); return toggleTicket(el.dataset.toggleTicket); }
  if ((el = hit("data-ttab"))) { S.ticketTab = el.dataset.ttab; return renderAll(); }
  if (hit("data-new-ticket")) return newTicketModal();
  if ((el = hit("data-halo-split"))) return haloSplit(el.dataset.haloSplit);
  if ((el = hit("data-estimate"))) {
    const parts = el.dataset.estimate.split(":");
    return parts[0] === "t" ? openEstimator("ticket", parts[1]) : openEstimator("sub", parts[1], parts[2]);
  }
  if ((el = hit("data-est-size"))) { S.estDraft.size = el.dataset.estSize; return S.estDraft.redraw(); }
  if ((el = hit("data-est-rev")))  { S.estDraft.reviews = +el.dataset.estRev; return S.estDraft.redraw(); }
  if ((el = hit("data-sub"))) { const [tid, sid] = el.dataset.sub.split(":"); return toggleSubtask(tid, sid); }
  if ((el = hit("data-del-sub"))) {
    const [tid, sid] = el.dataset.delSub.split(":"), tk = findTicket(tid);
    tk.subtasks = tk.subtasks.filter(s => s.id !== sid); return renderAll();
  }
  if ((el = hit("data-sub-who"))) {
    const [tid, sid] = el.dataset.subWho.split(":");
    return menu(el, [{ label: "Assign to", opts: [ME].concat(PEOPLE.filter(p => p.team !== "External")).map(p =>
      ({ val: p.id, label: p.name, av: p.av, initials: p.initials })) }], v => {
      const s = findTicket(tid).subtasks.find(x => x.id === sid); s.who = v === "matias" ? "matias" : v; renderAll();
    });
  }
  if ((el = hit("data-sub-due"))) {
    const [tid, sid] = el.dataset.subDue.split(":");
    return menu(el, [{ label: "Due", opts: ["Today", "Thu", "Fri", "Mon", "No date"].map(d => ({ val: d, label: d })) }], v => {
      const s = findTicket(tid).subtasks.find(x => x.id === sid); s.due = v === "No date" ? "" : v; renderAll();
    });
  }
  if ((el = hit("data-status"))) {
    const tid = el.dataset.status;
    return menu(el, [{ label: "Status", opts: Object.keys(STATUS_LABEL).map(k => ({ val: k, label: STATUS_LABEL[k], dot: k })) }], v => {
      const tk = findTicket(tid); const was = tk.status; tk.status = v;
      if (v === "done" && was !== "done") { tk.subtasks.forEach(s => s.done = true); chime(true); draftFromTicket(tk); }
      renderAll();
    });
  }
  if ((el = hit("data-assign"))) {
    const tid = el.dataset.assign;
    return menu(el, [{ label: "Assignee", opts: [ME].concat(PEOPLE.filter(p => p.team !== "External")).map(p =>
      ({ val: p.id, label: p.name, av: p.av, initials: p.initials })) }], v => { findTicket(tid).assignee = v; renderAll(); });
  }
  if ((el = hit("data-due"))) {
    const tid = el.dataset.due;
    return menu(el, [{ label: "Due date", opts: ["Today", "Thu, Aug 7", "Fri, Aug 8", "Mon, Aug 11"].map(d => ({ val: d, label: d })) }],
      v => { findTicket(tid).due = v; renderAll(); });
  }
  if ((el = hit("data-prio"))) {
    const tid = el.dataset.prio;
    return menu(el, [{ label: "Priority", opts: [["high", "High"], ["med", "Medium"], ["low", "Low"]].map(([v, l]) => ({ val: v, label: l })) }],
      v => { findTicket(tid).prio = v; renderAll(); });
  }
  if ((el = hit("data-del-ticket"))) {
    const tid = el.dataset.delTicket;
    S.tickets = S.tickets.filter(x => x.id !== tid); S.openTicket = null; renderAll();
    return toast("Ticket deleted.");
  }

  /* sources, privacy, notifications, rules, never-share */
  if ((el = hit("data-source"))) {
    let src;
    S.sources.forEach(c => c.items.forEach(i => { if (i.id === el.dataset.source) src = i; }));
    if (!src) return;
    src.on = !src.on;
    const affected = S.digest.filter(d => d.src.toLowerCase().includes(src.name.split(" ")[0].toLowerCase()));
    if (S.stage !== "app") { renderStage(); return; }
    renderAll();
    return toast(src.on
      ? "<strong>" + src.name + " reconnected.</strong> Halo can use it again."
      : "<strong>" + src.name + " off.</strong> " + (affected.length ? affected.length + " item" + (affected.length === 1 ? "" : "s") + " in your digest came from it — Halo will stop pulling from it entirely." : "Halo will ignore it entirely."));
  }
  if (t.id === "privacy-toggle" || t.closest("#privacy-toggle")) {
    S.privacy = !S.privacy; renderAll();
    return toast(S.privacy
      ? "<strong>Privacy Mode on.</strong> Collection paused. Anyone who asks is told to reach you directly."
      : "<strong>Privacy Mode off.</strong> Halo is representing you again.");
  }
  if ((el = hit("data-notif"))) { S.notifs[el.dataset.notif] = !S.notifs[el.dataset.notif]; return renderAll(); }
  if ((el = hit("data-rule"))) {
    const [cat, val] = el.dataset.rule.split(":");
    S.rules[cat] = val; S.digest.forEach(d => { if (d.cat === cat) d.locked = false; });
    applyMode(true); applyRules(); renderAll();
    return toast("<strong>" + CAT_LABEL[cat] + "</strong> → " + (val === "auto" ? "publish automatically." : val === "digest" ? "wait in your digest." : "never publish."));
  }
  if ((el = hit("data-del-never"))) {
    const i = +el.dataset.delNever, removed = S.neverShare[i];
    S.neverShare.splice(i, 1);
    if (S.stage !== "app") { renderStage(); return; }
    renderAll();
    return toast("Removed “" + removed + "” from Never Share.", { label: "Undo", fn: () => { S.neverShare.splice(i, 0, removed); renderAll(); } });
  }
  if (hit("data-add-never")) {
    return modal({ title: "Never share", sub: "Halo refuses to answer anything touching this — it redirects instead of guessing.",
      body: '<div class="field"><span class="field-label">Topic</span><input class="field-input" id="ns" placeholder="e.g. Interview scheduling" /></div>',
      ok: "Add", onOk: () => { const v = $("#ns").value.trim(); if (v) { S.neverShare.push(v); closeOverlay(); renderAll(); toast("Added. Halo will never speak to that."); } } });
  }
  if (hit("data-edit-pinned")) {
    return modal({ title: "Pinned message", sub: "Shown at the top of every Halo query about you.",
      body: '<div class="field"><textarea class="field-textarea" id="pin">' + esc(S.pinned) + "</textarea></div>",
      ok: "Save", onOk: () => { S.pinned = $("#pin").value.trim() || S.pinned; closeOverlay(); renderAll(); toast("Pinned message updated."); } });
  }
  if (hit("data-reset-dials")) { S.dials = { formality: 35, length: 45, warmth: 60, certainty: 40 }; renderAll(); return toast("Dials reset to what Halo learned from your writing."); }

  /* quick add */
  if ((el = hit("data-capture"))) { S.capture = el.dataset.capture; return renderAll(); }
  if ((el = hit("data-cap-aud"))) { S.captureAud[el.dataset.capAud] = !S.captureAud[el.dataset.capAud]; return renderAll(); }
  if (hit("data-shutter")) { chime(true); return toast("Captured. Halo wrote the caption below — edit it if it got it wrong."); }
  if (hit("data-add-tag")) return toast("Tag added from your current work context.");
  if (hit("data-capture-save")) {
    const text = S.capture === "text"
      ? ($("#capture-text") ? $("#capture-text").value.trim() : "")
      : ($("#capture-caption") ? $("#capture-caption").textContent.trim() : CAPTURE[S.capture].caption);
    if (!text) return toast("Write something first — even a sentence.");
    const item = { id: uid("d"), cat: "work", tag: "MANUAL ENTRY", src: "You · " + CAPTURE[S.capture].label.toLowerCase(), conf: "high",
      routine: false, sensitive: false, text, hero: text.slice(0, 60).toLowerCase(), heroExec: "",
      aud: Object.assign({}, S.captureAud), locked: true,
      state: S.mode === "ambient" ? "published" : "pending" };
    S.digest.unshift(item);
    if (item.state === "published") logActivity("pub", "Published your manual entry: <em>“" + esc(text.slice(0, 60)) + "…”</em>", "You · Quick Add");
    renderAll();
    return toast(item.state === "published" ? "<strong>Added and published.</strong>" : "<strong>Added to your digest.</strong> Nothing is shared until you approve it.",
      { label: "Open digest", fn: () => go("digest") });
  }

  /* meeting recap */
  if (hit("data-run-recap")) {
    S.recap = "running"; renderAll();
    setTimeout(() => { S.recap = "done"; renderAll(); toast("<strong>Recap ready.</strong> Nothing has left this screen yet."); }, 700);
    return;
  }
  if (hit("data-recap-digest")) {
    const item = { id: uid("d"), cat: "meeting", tag: "MEETING OUTCOME", src: "Fever kickoff", conf: "high",
      routine: true, sensitive: false, text: RECAP.summary,
      hero: "supporting the Fever API kickoff", heroExec: "supporting a client integration",
      aud: { team: true, manager: true, exec: false }, locked: true,
      state: S.mode === "ambient" ? "published" : "pending" };
    S.digest.unshift(item); renderAll();
    return toast(item.state === "published" ? "<strong>Published.</strong> It's in your activity log." : "<strong>Sent to your digest.</strong>",
      { label: "Open", fn: () => go(item.state === "published" ? "activity" : "digest") });
  }
  if (hit("data-recap-tickets")) {
    let n = 0;
    RECAP.actions.forEach(a => {
      if (S.tickets.some(t => t.title === a.title)) return;
      S.tickets.unshift({ id: uid("t"), title: a.title, tag: a.tag, warn: a.tag === "Open question", origin: "Halo · Fever kickoff",
        due: a.due, status: "todo", prio: "med", assignee: a.who, desc: "Captured from the Fever kickoff recap.",
        est: proposeEstimate(a.tag, "M", 0).pert, spent: 0, size: "M", reviews: 0,
        subtasks: [], trail: [{ t: "Halo created this from the meeting recap", m: "Today " + nowLabel() }] });
      n++;
    });
    renderAll();
    return toast(n ? "<strong>" + n + " ticket" + (n === 1 ? "" : "s") + " created.</strong> Open one to break it down." : "Those tickets already exist.",
      { label: "See tickets", fn: () => go("tickets") });
  }
  if ((el = hit("data-recap-one"))) {
    const a = RECAP.actions[+el.dataset.recapOne];
    if (S.tickets.some(x => x.title === a.title)) return toast("That ticket already exists.");
    const nt = { id: uid("t"), title: a.title, tag: a.tag, warn: a.tag === "Open question", origin: "Halo · Fever kickoff",
      due: a.due, status: "todo", prio: "med", assignee: a.who, desc: "Captured from the Fever kickoff recap.",
      est: proposeEstimate(a.tag, "M", 0).pert, spent: 0, size: "M", reviews: 0,
      subtasks: [], trail: [{ t: "Halo created this from the meeting recap", m: "Today " + nowLabel() }] };
    S.tickets.unshift(nt);
    return toast("<strong>Ticket created.</strong>", { label: "Open it", fn: () => go("tickets", { ticket: nt.id }) });
  }

  /* goal decomposition */
  if (hit("data-run-goal")) {
    const text = ($("#goal-input") ? $("#goal-input").value.trim() : "");
    if (!text) return toast("Paste what you were told first.");
    S.goal = { text, lib: decompose(text) }; renderAll();
    return toast("<strong>Broken down.</strong> Check Halo's reading before you commit to it — it says what it assumed.");
  }
  if ((el = hit("data-goal-example"))) { S.goal = { text: el.dataset.goalExample, lib: decompose(el.dataset.goalExample) }; return renderAll(); }
  if (hit("data-goal-tickets")) {
    if (!S.goal) return;
    let n = 0;
    S.goal.lib.steps.forEach(s => {
      if (S.tickets.some(t => t.title === s.t)) return;
      S.tickets.unshift({ id: uid("t"), title: s.t, tag: s.m.split(" · ")[0], warn: false, origin: "Halo · goal breakdown",
        due: ({ Tue: "Tue, Aug 5", Wed: "Today", Thu: "Thu, Aug 7", Fri: "Fri, Aug 8", Mon: "Mon, Aug 11" })[s.m.split(" · ").pop()] || "Fri, Aug 8",
        status: "todo", prio: "med", assignee: "matias", desc: "From the directive: “" + S.goal.text + "”",
        est: proposeEstimate(s.m.split(" · ")[0], "M", 0).pert, spent: 0, size: "M", reviews: 0,
        subtasks: [], trail: [{ t: "Halo decomposed this from a directive", m: "Today " + nowLabel() }] });
      n++;
    });
    renderAll();
    return toast(n ? "<strong>" + n + " tickets created</strong> from one vague sentence." : "Those already exist as tickets.",
      { label: "See tickets", fn: () => go("tickets") });
  }
  if ((el = hit("data-goal-one"))) {
    const s = S.goal.lib.steps[+el.dataset.goalOne];
    if (S.tickets.some(t => t.title === s.t)) return toast("That one already exists.");
    S.tickets.unshift({ id: uid("t"), title: s.t, tag: s.m.split(" · ")[0], warn: false, origin: "Halo · goal breakdown",
      due: "Fri, Aug 8", status: "todo", prio: "med", assignee: "matias", desc: "From the directive: “" + S.goal.text + "”",
      est: proposeEstimate(s.m.split(" · ")[0], "M", 0).pert, spent: 0, size: "M", reviews: 0,
      subtasks: [], trail: [{ t: "Halo decomposed this from a directive", m: "Today " + nowLabel() }] });
    return toast("<strong>Ticket created.</strong>", { label: "See tickets", fn: () => go("tickets") });
  }

  /* search */
  if (t.closest("#search-trigger")) return openPalette();
});

/* ---------------- Inline editing (contenteditable) ---------------- */
document.addEventListener("blur", e => {
  const t = e.target;
  if (t.dataset && t.dataset.renameTicket) {
    const tk = findTicket(t.dataset.renameTicket);
    if (tk) { const v = t.textContent.trim(); if (v && v !== tk.title) { tk.title = v; toast("Renamed."); } }
  }
  if (t.dataset && t.dataset.renameSub) {
    const [tid, sid] = t.dataset.renameSub.split(":");
    const tk = findTicket(tid); if (!tk) return;
    const s = tk.subtasks.find(x => x.id === sid);
    if (s) { const v = t.textContent.trim(); if (v) s.name = v; }
  }
}, true);

document.addEventListener("keydown", e => {
  if (e.target.hasAttribute && e.target.hasAttribute("contenteditable") && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return openPalette(); }
  if (e.key === "Escape") return closeOverlay();
  const pal = $("#palette-input");
  if (pal && document.activeElement === pal) {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteSel = Math.min(paletteSel + 1, paletteRows.length - 1); renderPalette(pal.value); }
    if (e.key === "ArrowUp") { e.preventDefault(); paletteSel = Math.max(paletteSel - 1, 0); renderPalette(pal.value); }
    if (e.key === "Enter" && paletteRows[paletteSel]) { const fn = paletteRows[paletteSel].fn; closeOverlay(); fn(); }
  }
});

/* ---------------- Boot ---------------- */
bootData();
renderAll();
renderStage();

/* Tour keyboard shortcuts */
document.addEventListener("keydown", e => {
  if (S.stage !== "tour") return;
  if (e.key === " ") { e.preventDefault(); tourToggle(); }
  if (e.key === "ArrowRight") { S.tour.left = TOUR_MS; tourGo(S.tour.i + 1); }
  if (e.key === "ArrowLeft") { S.tour.left = TOUR_MS; tourGo(S.tour.i - 1); }
  if (e.key === "Escape") { clearTimeout(S.tour.timer); S.stage = "setup"; S.setupStep = 0; renderStage(); }
});
</script>
</body>
</html>
