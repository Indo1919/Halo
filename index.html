    border-radius: 10px; gap: 2px;
  }
  .tickets-tab {
    padding: 8px 16px; font-size: 13px; font-weight: 500;
    color: var(--muted); border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: all var(--transition);
  }
  .tickets-tab:hover { color: var(--ink); }
  .tickets-tab.active {
    background: var(--surface); color: var(--ink); font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .tickets-tab-count {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--surface-3); color: var(--muted); font-weight: 600;
  }
  .tickets-tab.active .tickets-tab-count { background: var(--gold-soft); color: #7A5A1E; }
  .tickets-toolbar-right { display: flex; gap: 6px; }

  .tickets-view { display: none; }
  .tickets-view.active { display: block; animation: fadeIn 200ms ease; }

  .tickets-group-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 20px 0 10px;
  }
  .tickets-group-label:first-child { margin-top: 0; }
  .ticket-list-row {
    display: grid; grid-template-columns: 22px 1fr auto;
    gap: 14px; align-items: center;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    transition: all var(--transition);
  }
  .ticket-list-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .ticket-list-row.completed { background: var(--surface-2); opacity: 0.75; }
  .ticket-list-row.completed .ticket-list-title { text-decoration: line-through; color: var(--muted); }
  .ticket-list-content { display: flex; flex-direction: column; gap: 4px; }
  .ticket-list-title { font-size: 14px; font-weight: 500; }
  .ticket-list-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .ticket-list-due {
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    padding: 4px 10px; border-radius: 6px; background: var(--surface-2);
    white-space: nowrap;
  }
  .ticket-list-due.overdue { background: var(--rose-soft); color: var(--rose); }
  .ticket-list-due.done { background: var(--sage-soft); color: var(--sage); }

  /* ================================================================ */
  /* DAILY DIGEST */
  /* ================================================================ */
  .nav-count-alert {
    background: var(--gold) !important;
    color: var(--ink) !important;
    font-weight: 700 !important;
  }
  .nav-item.active .nav-count-alert { background: var(--gold) !important; color: var(--ink) !important; }

  .digest-banner {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--gold-soft) 0%, #F9EED1 100%);
    border: 1px solid rgba(212, 162, 74, 0.35);
    border-radius: 12px;
    margin-bottom: 20px;
    cursor: pointer;
    transition: box-shadow var(--transition);
  }
  .digest-banner:hover { box-shadow: var(--shadow-md); }
  .digest-banner-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--gold); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .digest-banner-text { flex: 1; font-size: 13px; color: #6B4914; line-height: 1.5; }
  .digest-banner-text strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }

  .digest-summary-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
    gap: 16px;
  }
  .digest-summary-left { display: flex; align-items: center; gap: 16px; }
  .digest-summary-count {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--gold); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    flex-shrink: 0;
  }
  .digest-summary-title { font-size: 16px; font-weight: 700; }
  .digest-summary-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .digest-summary-actions { display: flex; gap: 8px; }

  .digest-list { display: flex; flex-direction: column; gap: 14px; }
  .digest-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--transition);
  }
  .digest-item.flagged {
    border-color: rgba(183, 87, 87, 0.35);
    background: linear-gradient(135deg, var(--surface) 0%, #FDF6F6 100%);
  }
  .digest-item-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 14px;
  }
  .digest-item-what { display: flex; flex-direction: column; gap: 6px; }
  .digest-tag {
    display: inline-flex; align-items: center; width: fit-content;
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    padding: 3px 10px; border-radius: 6px;
    text-transform: uppercase;
  }
  .digest-tag.design { background: var(--gold-soft); color: #7A5A1E; }
  .digest-tag.meeting { background: var(--sage-soft); color: var(--sage); }
  .digest-tag.availability { background: #E7EDF7; color: #3B5488; }
  .digest-tag.flagged-tag { background: var(--rose-soft); color: var(--rose); }
  .digest-item-source { font-size: 12px; color: var(--muted); }
  .digest-decision { display: flex; gap: 6px; flex-shrink: 0; }
  .digest-btn {
    padding: 6px 12px; font-size: 12.5px; font-weight: 600;
    border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted);
    transition: all var(--transition);
    font-family: inherit;
  }
  .digest-btn:hover { border-color: var(--muted-2); color: var(--ink); }
  .digest-btn.approve.active {
    background: var(--sage); color: #FFF; border-color: var(--sage);
  }
  .digest-btn.hold.active {
    background: var(--rose); color: #FFF; border-color: var(--rose);
  }
  .digest-item-preview {
    padding: 14px 16px;
    background: var(--surface-2);
    border-left: 3px solid var(--ink);
    border-radius: 4px;
    font-size: 14px; line-height: 1.6;
    font-style: italic;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .digest-item.flagged .digest-item-preview { border-left-color: var(--rose); }
  .digest-preview-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 6px; font-style: normal;
  }
  .digest-item-audience { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .digest-aud {
    padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
    background: var(--surface-2); color: var(--muted-2);
    border: 1px solid var(--border);
  }
  .digest-aud.on { background: var(--ink); color: var(--gold); border-color: var(--ink); font-weight: 600; }
  .digest-flag-note {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--rose); line-height: 1.5;
    padding: 8px 0 0;
  }

  .digest-learn-note {
    display: flex; gap: 12px; align-items: flex-start;
    margin-top: 20px;
    padding: 16px 18px;
    background: var(--surface-2);
    border-radius: 10px;
    font-size: 13px; color: var(--ink-2); line-height: 1.6;
  }
  .digest-learn-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--gold-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .digest-footer-bar {
    position: sticky; bottom: 0;
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px;
    padding: 16px 20px;
    background: rgba(250, 247, 242, 0.92);
    backdrop-filter: saturate(180%) blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
  }
  .digest-footer-status { font-size: 13px; font-weight: 600; color: var(--ink-2); }

  /* Guide overlay */
  .guide-overlay {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--ink); color: #FFF;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 12.5px;
    box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 10px;
    max-width: 340px;
    z-index: 100;
    animation: slideUp 300ms ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .guide-overlay strong { color: var(--gold); }
  .guide-overlay button {
    margin-left: auto; background: transparent; border: 0; color: rgba(255,255,255,0.6);
    cursor: pointer; padding: 4px; font-size: 16px; line-height: 1;
  }

  /* Icons via inline SVG helpers */
  .ico { width: 15px; height: 15px; display: inline-block; vertical-align: -3px; }

  /* ================================================================ */
  /* ADDED — TRUST SPECTRUM, TICKET DETAIL, PALETTE, TOASTS           */
  /* ================================================================ */

  /* ---- Trust spectrum mode cards ---- */
  .mode-question { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  .mode-question-sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; max-width: 760px; line-height: 1.55; }
  .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .mode-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    cursor: pointer;
    position: relative;
    transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  }
  .mode-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .mode-card.current { border-color: var(--gold); border-width: 2px; padding: 19px; box-shadow: var(--shadow-md); }
  .mode-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .mode-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); flex-shrink: 0;
  }
  .mode-card.current .mode-icon { background: var(--gold-soft); color: var(--gold-hover); }
  .mode-icon svg { width: 19px; height: 19px; }
  .mode-current-badge {
    background: var(--gold); color: #FFF;
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 20px;
  }
  .mode-info {
    margin-left: auto; width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid var(--border-strong); color: var(--muted-2);
    font-size: 10px; font-weight: 700; font-style: italic;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mode-info:hover { border-color: var(--gold); color: var(--gold-hover); }
  .mode-name { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  .mode-desc { font-size: 13.5px; color: var(--muted); margin-bottom: 22px; }
  .mode-meter { height: 5px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-bottom: 10px; }
  .mode-meter-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--sage), var(--gold)); }
  .mode-scale { font-size: 11.5px; color: var(--muted-2); }
  .mode-banner {
    margin-top: 18px;
    display: flex; gap: 14px; align-items: flex-start;
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    font-size: 13.5px; line-height: 1.6;
    border: 1px solid transparent;
  }
  .mode-banner strong { font-weight: 700; }
  .mode-banner.ambient { background: var(--gold-soft); border-color: #E8D5A8; color: var(--ink-2); }
  .mode-banner.balanced { background: var(--sage-soft); border-color: #CBDCD1; color: var(--ink-2); }
  .mode-banner.curated { background: var(--rose-soft); border-color: #E7C9C9; color: var(--ink-2); }
  .mode-banner-icon {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.65); color: var(--ink-2);
  }
  .mode-banner-icon svg { width: 16px; height: 16px; }

  /* ---- Category rules table ---- */
  .rule-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .rule-row:last-child { border-bottom: 0; }
  .rule-name { font-size: 13px; font-weight: 600; }
  .rule-desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .rule-seg { margin-left: auto; display: flex; background: var(--surface-2); border-radius: 7px; padding: 2px; gap: 2px; }
  .rule-opt {
    font-size: 11px; padding: 5px 9px; border-radius: 5px; cursor: pointer;
    color: var(--muted); font-weight: 500; white-space: nowrap;
    transition: all var(--transition);
  }
  .rule-opt:hover { color: var(--ink-2); }
  .rule-opt.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 600; }

  /* ---- Auto-published strip (Balanced / Ambient) ---- */
  .autopub {
    background: var(--sage-soft);
    border: 1px solid #CBDCD1;
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .autopub-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; cursor: pointer;
  }
  .autopub-title { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .autopub-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .autopub-chev { margin-left: auto; color: var(--muted); transition: transform var(--transition); }
  .autopub.open .autopub-chev { transform: rotate(90deg); }
  .autopub-body { display: none; padding: 0 18px 14px; }
  .autopub.open .autopub-body { display: block; }
  .autopub-item {
    background: rgba(255,255,255,0.7);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
    font-size: 13px; color: var(--ink-2); line-height: 1.55;
  }
  .autopub-item:last-child { margin-bottom: 0; }
  .autopub-item-meta {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    font-size: 11px; color: var(--muted);
  }
  .autopub-undo {
    margin-left: auto; color: var(--rose); cursor: pointer; font-weight: 600;
  }
  .autopub-undo:hover { text-decoration: underline; }

  /* ---- Digest inline editor ---- */
  .digest-edit-area {
    width: 100%;
    font-family: inherit; font-size: 13.5px; line-height: 1.6;
    color: var(--ink); font-style: italic;
    background: var(--surface); border: 1px solid var(--gold);
    border-radius: 8px; padding: 14px 16px;
    resize: vertical; min-height: 92px;
    outline: none;
  }
  .digest-edit-actions { display: flex; gap: 8px; margin-top: 10px; }

  .digest-item.published { opacity: 0.55; }
  .digest-item.resolved-approve { border-left: 3px solid var(--sage); }
  .digest-item.resolved-hold { border-left: 3px solid var(--rose); }
  .digest-why {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .digest-why svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--muted-2); }

  /* ---- Suggestion chips (no × affordance) ---- */
  .suggest-chip {
    padding: 5px 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px; color: var(--ink-2);
    cursor: pointer;
    transition: all var(--transition);
  }
  .suggest-chip:hover { border-color: var(--gold); background: var(--gold-soft); }

  /* ---- Empty state ---- */
  .empty {
    text-align: center; padding: 56px 24px;
    background: var(--surface); border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg);
  }
  .empty-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--surface-2); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .empty-icon svg { width: 22px; height: 22px; }
  .empty-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .empty-text { font-size: 13px; color: var(--muted); max-width: 380px; margin: 0 auto; line-height: 1.6; }

  /* ---- Activity log (Ambient) ---- */
  .activity-row {
    display: flex; gap: 14px; padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .activity-row:last-child { border-bottom: 0; }
  .activity-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--sage);
    margin-top: 6px; flex-shrink: 0;
  }
  .activity-dot.query { background: var(--gold); }
  .activity-dot.hold { background: var(--rose); }
  .activity-dot.sys { background: var(--border-strong); }
  .activity-main { flex: 1; min-width: 0; }
  .activity-text { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
  .activity-text em { font-style: italic; color: var(--ink); }
  .activity-meta { font-size: 11.5px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .activity-time { font-size: 11.5px; color: var(--muted-2); white-space: nowrap; flex-shrink: 0; }
  .activity-correct { color: var(--gold-hover); cursor: pointer; font-weight: 600; }
  .activity-correct:hover { text-decoration: underline; }

  /* ---- Ticket detail ---- */
  .detail-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted); cursor: pointer;
    margin-bottom: 14px; font-weight: 500;
  }
  .detail-back:hover { color: var(--ink); }
  .detail-back svg { width: 14px; height: 14px; }
  .detail-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
  .detail-title-row { display: flex; align-items: flex-start; gap: 12px; }
  .detail-title {
    font-size: 23px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 6px; line-height: 1.3; flex: 1;
  }
  .detail-title[contenteditable="true"]:focus {
    outline: none; background: var(--gold-soft); border-radius: 6px;
    box-shadow: 0 0 0 6px var(--gold-soft);
  }
  .detail-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .detail-desc {
    font-size: 13.5px; line-height: 1.65; color: var(--ink-2);
    background: var(--surface-2); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 20px;
  }
  .progress-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .progress-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .progress-count { font-size: 12px; color: var(--muted); }
  .progress-track { height: 8px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, var(--sage), #7A9A82);
    transition: width 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-fill.done { background: linear-gradient(90deg, var(--gold), var(--gold-hover)); }
  .progress-mini { height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; width: 62px; }
  .progress-mini-fill { height: 100%; background: var(--sage); border-radius: 3px; transition: width 300ms ease; }

  .subtask-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 8px;
    border: 1px solid transparent;
    transition: background var(--transition);
  }
  .subtask-row:hover { background: var(--surface-2); border-color: var(--border); }
  .subtask-row.done .subtask-name { text-decoration: line-through; color: var(--muted-2); }
  .subtask-name { font-size: 13.5px; color: var(--ink-2); flex: 1; min-width: 0; }
  .subtask-name[contenteditable="true"]:focus { outline: none; background: var(--gold-soft); border-radius: 4px; }
  .subtask-assign {
    width: 25px; height: 25px; border-radius: 50%;
    font-size: 9.5px; font-weight: 700; color: #FFF;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    border: 2px solid transparent;
  }
  .subtask-assign:hover { border-color: var(--gold); }
  .subtask-assign.unassigned {
    background: var(--surface-3); color: var(--muted);
    border: 1px dashed var(--border-strong);
  }
  .subtask-due {
    font-size: 11.5px; color: var(--muted); white-space: nowrap;
    padding: 3px 8px; border-radius: 5px; background: var(--surface-2);
    cursor: pointer;
  }
  .subtask-due:hover { background: var(--surface-3); }
  .subtask-due.overdue { color: var(--rose); background: var(--rose-soft); font-weight: 600; }
  .subtask-del {
    color: var(--muted-2); cursor: pointer; font-size: 15px; line-height: 1;
    padding: 2px 4px; opacity: 0; transition: opacity var(--transition);
  }
  .subtask-row:hover .subtask-del { opacity: 1; }
  .subtask-del:hover { color: var(--rose); }
  .subtask-add {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; margin-top: 4px;
    border-top: 1px dashed var(--border);
  }
  .subtask-add input {
    flex: 1; border: 0; outline: none; background: transparent;
    font-family: inherit; font-size: 13.5px; color: var(--ink);
  }
  .subtask-add input::placeholder { color: var(--muted-2); }

  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .meta-row:last-child { border-bottom: 0; }
  .meta-key { color: var(--muted); font-size: 12.5px; }
  .meta-val { font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .meta-val:hover { color: var(--gold-hover); }
  .status-pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    padding: 4px 10px; border-radius: 20px; text-transform: uppercase;
  }
  .status-pill.todo { background: var(--surface-3); color: var(--muted); }
  .status-pill.progress { background: var(--gold-soft); color: var(--gold-hover); }
  .status-pill.blocked { background: var(--rose-soft); color: var(--rose); }
  .status-pill.done { background: var(--sage-soft); color: var(--sage); }
  .prio-pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 5px; }
  .prio-pill.high { background: var(--rose-soft); color: var(--rose); }
  .prio-pill.med { background: var(--gold-soft); color: var(--gold-hover); }
  .prio-pill.low { background: var(--surface-3); color: var(--muted); }

  .trail-item { display: flex; gap: 10px; padding: 9px 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .trail-bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); margin-top: 6px; flex-shrink: 0; }
  .trail-item strong { color: var(--ink-2); font-weight: 600; }

  /* ---- Dropdown menu ---- */
  .menu {
    position: absolute; z-index: 400;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-lg);
    padding: 5px; min-width: 190px;
    animation: menuIn 120ms ease;
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .menu-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 6px;
    font-size: 13px; color: var(--ink-2); cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item.active { background: var(--gold-soft); font-weight: 600; }
  .menu-label {
    font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted-2); font-weight: 700; padding: 8px 10px 4px;
  }
  .menu-avatar {
    width: 21px; height: 21px; border-radius: 50%; color: #FFF;
    font-size: 8.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* ---- Command palette ---- */
  .palette-scrim {
    position: fixed; inset: 0; background: rgba(15, 23, 41, 0.28);
    backdrop-filter: blur(2px); z-index: 500;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 14vh;
    animation: fadeIn 140ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .palette {
    width: min(620px, 92vw);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: paletteIn 160ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes paletteIn { from { opacity: 0; transform: translateY(-10px) scale(0.985); } to { opacity: 1; transform: none; } }
  .palette-input-row { display: flex; align-items: center; gap: 11px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .palette-input-row svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
  .palette-input {
    flex: 1; border: 0; outline: none; background: transparent;
    font-family: inherit; font-size: 15px; color: var(--ink);
  }
  .palette-input::placeholder { color: var(--muted-2); }
  .palette-results { max-height: 340px; overflow-y: auto; padding: 6px; }
  .palette-row {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; color: var(--ink-2);
  }
  .palette-row.sel { background: var(--surface-2); }
  .palette-row-kind {
    margin-left: auto; font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--muted-2); font-weight: 700;
  }
  .palette-row-icon { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .palette-empty { padding: 26px; text-align: center; font-size: 13px; color: var(--muted); }
  .palette-foot {
    padding: 9px 16px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted-2);
    display: flex; gap: 14px; background: var(--surface-2);
  }

  /* ---- Modal ---- */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(15, 23, 41, 0.32);
    backdrop-filter: blur(2px); z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeIn 140ms ease;
  }
  .modal {
    width: min(560px, 100%);
    max-height: 86vh; overflow-y: auto;
    background: var(--surface); border-radius: 14px;
    box-shadow: var(--shadow-lg);
    animation: paletteIn 170ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .modal-head { padding: 20px 22px 0; }
  .modal-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 5px; }
  .modal-sub { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 0; }
  .modal-body { padding: 18px 22px; }
  .modal-foot {
    padding: 14px 22px; border-top: 1px solid var(--border);
    display: flex; gap: 9px; justify-content: flex-end;
    background: var(--surface-2);
    border-radius: 0 0 14px 14px;
  }
  .field { margin-bottom: 14px; }
  .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .field-input, .field-select, .field-textarea {
    width: 100%; font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 10px 12px; outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .field-input:focus, .field-select:focus, .field-textarea:focus {
    border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft);
  }
  .field-textarea { resize: vertical; min-height: 84px; line-height: 1.6; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---- Toasts ---- */
  .toast-host {
    position: fixed; bottom: 22px; right: 22px; z-index: 600;
    display: flex; flex-direction: column-reverse; gap: 10px;
    pointer-events: none;
  }
  .toast {
    background: var(--ink); color: #FFF;
    padding: 13px 16px; border-radius: 10px;
    font-size: 13px; line-height: 1.5;
    box-shadow: var(--shadow-lg);
    display: flex; align-items: flex-start; gap: 11px;
    max-width: 380px; pointer-events: none;
    animation: slideUp 260ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toast.out { animation: slideOut 220ms ease forwards; }
  @keyframes slideOut { to { opacity: 0; transform: translateY(10px); } }
  .toast-icon { color: var(--gold); flex-shrink: 0; margin-top: 1px; }
  .toast-icon svg { width: 15px; height: 15px; }
  .toast strong { color: var(--gold); font-weight: 600; }
  .toast-action {
    margin-left: auto; color: var(--gold); font-weight: 600;
    cursor: pointer; white-space: nowrap; padding-left: 8px;
    pointer-events: auto;
  }
  .toast-action:hover { text-decoration: underline; }

  /* ---- Misc utilities ---- */
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack-8 > * + * { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-20 { margin-top: 20px; }
  .muted-note { font-size: 12px; color: var(--muted); line-height: 1.55; }
  .clickable { cursor: pointer; }
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--sage);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(96, 123, 103, 0.4); }
    50% { opacity: 0.75; box-shadow: 0 0 0 5px rgba(96, 123, 103, 0); }
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2);
    animation: typing 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .flash { animation: flash 900ms ease; }
  @keyframes flash {
    0% { background: var(--gold-soft); }
    100% { background: transparent; }
  }
  .dial-slider { cursor: pointer; }
  .dial-thumb { cursor: grab; }
  .dial-thumb:active { cursor: grabbing; }
  .dial-value { font-size: 11px; color: var(--muted-2); min-width: 62px; text-align: right; }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg-opt {
    font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    color: var(--muted); font-weight: 500; transition: all var(--transition);
  }
  .seg-opt:hover { color: var(--ink-2); }
  .seg-opt.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }

  .step-row {
    display: flex; gap: 13px; padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }
  .step-row:last-child { border-bottom: 0; }
  .step-num {
    width: 23px; height: 23px; border-radius: 50%;
    background: var(--gold-soft); color: var(--gold-hover);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .step-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .step-check {
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong);
    cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .step-check.on { background: var(--sage); border-color: var(--sage); }
  .step-check.on::after { content: "✓"; color: #FFF; font-size: 11px; font-weight: 700; }

  @media (max-width: 1180px) {
    .detail-layout, .voice-layout, .chat-layout, .book-layout, .goal-layout, .meeting-layout, .dashboard-grid, .team-layout { grid-template-columns: 1fr; }
    .mode-grid { grid-template-columns: 1fr; }
  }

  /* ================================================================ */
  /* REFINEMENT PASS — lighter icon weight, Apple-style surfaces,     */
  /* Jira-style density and lozenges                                  */
  /* ================================================================ */

  :root {
    --radius: 10px;
    --radius-lg: 14px;
    --border: #EBE5D8;
    --border-strong: #DCD2BD;
    --shadow-sm: 0 1px 2px rgba(15, 23, 41, 0.03);
    --shadow-md: 0 3px 10px rgba(15, 23, 41, 0.045);
    --shadow-lg: 0 12px 34px rgba(15, 23, 41, 0.09);
    --transition: 200ms cubic-bezier(0.32, 0.72, 0, 1);
  }

  /* Apple-style optical type: tighter tracking as size grows */
  .page-title { letter-spacing: -0.028em; font-weight: 700; }
  .detail-title, .mode-name { letter-spacing: -0.024em; }
  .page-sub { letter-spacing: -0.003em; }
  .card-title, .sidebar-section-title, .tickets-group-label,
  .nav-group-label, .source-cat-title { letter-spacing: 0.06em; }
  .hero-response, .preview-answer { letter-spacing: -0.006em; }

  /* Hairline surfaces, softer corners */
  .card, .hero-card, .preview-card, .privacy-card, .digest-item,
  .person-card, .source-card, .book-person-card, .meeting-header-card,
  .quick-add-container, .history-entry, .digest-summary-bar, .cal-day {
    border-radius: var(--radius-lg);
  }
  .card, .digest-item, .person-card, .source-card, .history-entry { box-shadow: var(--shadow-sm); }
  .person-card:hover, .source-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .person-card, .source-card { transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition); }

  /* Buttons — quieter borders, Apple-ish press feedback */
  .btn {
    border-radius: 8px;
    letter-spacing: -0.005em;
    transition: background var(--transition), border-color var(--transition),
                transform 90ms ease, box-shadow var(--transition);
  }
  .btn:active { transform: scale(0.975); }
  .btn.gold { box-shadow: 0 1px 2px rgba(180, 133, 51, 0.22); }
  .btn.gold:active { box-shadow: none; }

  /* Sidebar — lighter, rounder, calmer hover */
  .sidebar { border-right: 1px solid var(--border); }
  .nav-item { border-radius: 8px; letter-spacing: -0.004em; }
  .nav-item:hover { background: rgba(15, 23, 41, 0.035); }
  .nav-icon svg, .ico { stroke-width: 1.5; }
  .nav-count { border-radius: 6px; font-variant-numeric: tabular-nums; }
  .fab { border-radius: 10px; box-shadow: 0 1px 2px rgba(180, 133, 51, 0.2); }
  .fab:active { transform: scale(0.985); }

  /* Topbar */
  .topbar { border-bottom: 1px solid var(--border); }
  .search-input { border-radius: 9px; }
  .status-chip { border-radius: 8px; }
  .kbd { border-radius: 5px; }

  /* Jira-style lozenges: compact, squared, tabular */
  .status-pill, .ticket-tag, .digest-tag, .prio-pill, .history-role-tag {
    border-radius: 4px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .work-status, .chip, .voice-badge, .source-chip, .suggest-chip,
  .never-share-chip, .digest-aud, .audience-quick-chip { border-radius: 7px; }
  .mode-current-badge { border-radius: 20px; letter-spacing: 0.09em; }

  /* Jira-style list density: hairline rows, clear hit targets */
  .ticket-list-row {
    border-radius: 9px;
    transition: background var(--transition), box-shadow var(--transition);
  }
  .ticket-list-row:hover { background: var(--surface); box-shadow: var(--shadow-sm); }
  .ticket-checkbox { border-radius: 6px; border-width: 1.5px; }
  .subtask-row { border-radius: 9px; }
  .progress-track, .progress-fill { border-radius: 6px; }

  /* Icon containers — lighter fill, thinner glyphs */
  .mode-icon, .empty-icon, .digest-banner-icon, .digest-learn-icon,
  .mode-banner-icon, .capture-icon-lg { border-radius: 11px; }
  .mode-icon svg, .empty-icon svg, .digest-banner-icon svg,
  .digest-learn-icon svg, .mode-banner-icon svg, .capture-icon-lg svg { stroke-width: 1.5; }

  /* Inputs */
  .field-input, .field-select, .field-textarea, .digest-edit-area,
  .chat-input-area input, .purpose-draft { border-radius: 9px; }

  /* Menus, modals, palette — Apple sheet feel */
  .menu, .modal, .palette { border-radius: 14px; }
  .modal-foot { border-radius: 0 0 14px 14px; }
  .menu-item, .palette-row { border-radius: 8px; }
  .toast { border-radius: 12px; }

  /* Segmented controls — iOS style */
  .seg, .rule-seg, .audience-switch, .capture-tabs { border-radius: 9px; }
  .seg-opt, .rule-opt, .aud { border-radius: 7px; }
  .aud, .seg-opt { transition: all var(--transition); }

  /* Calendar */
  .cal-ticket { border-radius: 8px; }
  .cal-today-pill, .duration-chip, .time-slot { border-radius: 7px; }

  /* ---- Standup card (the standup-replacement answer) ---- */
  .standup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .standup-col { padding: 0 18px; border-left: 1px solid var(--border); }
  .standup-col:first-child { padding-left: 0; border-left: 0; }
  .standup-col:last-child { padding-right: 0; }
  .standup-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2); font-weight: 700; margin-bottom: 9px;
  }
  .standup-line {
    font-size: 13.5px; line-height: 1.6; color: var(--ink-2);
    display: flex; gap: 8px; margin-bottom: 7px;
  }
  .standup-line:last-child { margin-bottom: 0; }
  .standup-bullet { color: var(--faint); flex-shrink: 0; }
  .standup-line.blocked { color: var(--rose); }
  .standup-line.clear { color: var(--sage); }

  /* ---- Hero transparency drawer ---- */
  .why-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); cursor: pointer;
    margin-top: 14px; font-weight: 500;
  }
  .why-toggle:hover { color: var(--ink-2); }
  .why-toggle svg { width: 13px; height: 13px; transition: transform var(--transition); }
  .why-open .why-toggle svg { transform: rotate(90deg); }
  .why-body { display: none; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--border); }
  .why-open .why-body { display: block; }
  .why-row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 7px 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5;
  }
  .why-row .source-chip { flex-shrink: 0; }
  .why-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.55; }

  /* ---- Deflection card ---- */
  .deflect {
    background: var(--sage-soft); border: 1px solid #CBDCD1;
    border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 18px;
  }
  .deflect-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .deflect-title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
  .deflect-answer {
    background: rgba(255,255,255,0.72); border-radius: 10px;
    padding: 13px 15px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2);
    font-style: italic;
  }
  .deflect-actions { display: flex; gap: 9px; margin-top: 13px; align-items: center; }

  /* ---- Signal strip ---- */
  .signal-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .signal-row:last-child { border-bottom: 0; }
  .signal-name { color: var(--ink-2); font-weight: 500; }
  .signal-count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .signal-bar { width: 92px; height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .signal-bar span { display: block; height: 100%; background: var(--sage); border-radius: 3px; }

  @media (max-width: 900px) { .standup-grid { grid-template-columns: 1fr; }
    .standup-col { border-left: 0; padding: 0 0 14px; } }

  /* ================================================================ */
  /* ICON SIZING — nothing stretches to its container, one optical    */
  /* weight everywhere                                                */
  /* ================================================================ */
  .app svg { flex-shrink: 0; }

  /* Inline icons inside buttons, chips and labels */
  .gi { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; stroke-width: 1.6; }
  .gi.trail { margin: 0 0 0 5px; }
  .gi.solo { margin: 0; }
  .btn.sm .gi { width: 12px; height: 12px; }
  .chip .gi, .digest-tag .gi { width: 11px; height: 11px; margin-right: 5px; vertical-align: -1.5px; }
  .standup-bullet .gi { width: 12px; height: 12px; margin: 0; vertical-align: -2px; }
  .digest-flag-note .gi { width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px; }
  .cal-focus .gi { width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px; }

  /* Container-bound icons: fixed glyph size inside a fixed frame */
  .digest-banner-icon svg { width: 18px; height: 18px; }
  .digest-learn-icon svg  { width: 16px; height: 16px; }
  .empty-icon svg         { width: 20px; height: 20px; }
  .mode-icon svg          { width: 18px; height: 18px; }
  .mode-banner-icon svg   { width: 15px; height: 15px; }
  .send-btn svg           { width: 15px; height: 15px; stroke-width: 1.6; }
  .work-icon svg          { width: 15px; height: 15px; color: var(--muted); }
  .source-icon svg        { width: 15px; height: 15px; }
  .capture-icon-lg svg    { width: 22px; height: 22px; }
  .deflect-head svg       { width: 16px; height: 16px; }
  .autopub-chev svg, .why-toggle svg { width: 13px; height: 13px; }
  .subtask-add svg        { width: 14px; height: 14px; color: var(--muted-2); }
  .nav-icon svg           { width: 16px; height: 16px; }
  .search-icon-svg        { width: 14px; height: 14px; }
  .deflect-head .gi { color: var(--sage); width: 16px; height: 16px; margin: 0; }
  .send-btn .gi { margin: 0; }
  .work-icon .gi { margin: 0; }
  .source-icon .gi { margin: 0; }
  .subtask-del .gi { width: 13px; height: 13px; margin: 0; vertical-align: -2px; }

  /* ================================================================ */
  /* ESTIMATES + CAPACITY                                             */
  /* ================================================================ */
  .est-chip {
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; white-space: nowrap;
    cursor: pointer; font-variant-numeric: tabular-nums;
    transition: all var(--transition);
  }
  .est-chip:hover { border-color: var(--gold); color: var(--gold-hover); background: var(--gold-soft); }
  .est-chip.sm { font-size: 11px; padding: 2px 7px; }

  .est-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .est-block.empty {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--muted); cursor: pointer;
    border: 1px dashed var(--border-strong); border-radius: 9px;
    padding: 11px 13px; margin-top: 16px;
  }
  .est-block.empty:hover { border-color: var(--gold); color: var(--gold-hover); }
  .est-block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .est-block-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .est-block-val { font-size: 12.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .est-block-val.alt { margin-left: auto; font-weight: 500; color: var(--muted); }
  .est-track { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .est-track span { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width 420ms cubic-bezier(0.32,0.72,0,1); }
  .est-track span.over { background: var(--rose); }
  .est-note { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; align-items: center; }
  .est-open { margin-left: auto; color: var(--gold-hover); font-weight: 600; cursor: pointer; }
  .est-open:hover { text-decoration: underline; }

  /* Calculator modal */
  .est-live {
    background: var(--surface-2); border-radius: 11px; padding: 18px;
    text-align: center; margin-bottom: 18px;
  }
  .est-live-num { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .est-live-range { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .est-live-note { font-size: 11.5px; color: var(--muted-2); margin-top: 8px; }
  .est-basis { background: var(--surface-2); border-radius: 10px; padding: 13px 15px; margin-top: 4px; }
  .est-basis-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2); font-weight: 700; margin-bottom: 8px;
  }
  .est-basis-row { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); padding: 3px 0; line-height: 1.5; }
  .est-basis-row .trail-bullet { margin-top: 7px; }
  #est-size .seg-opt, #est-rev .seg-opt { padding: 7px 16px; }

  /* Capacity card */
  .cap-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }
  .cap-card.over { border-color: #E7C9C9; background: linear-gradient(180deg, var(--rose-soft) 0%, var(--surface) 62%); }
  .cap-card.full { border-color: #E8D5A8; background: linear-gradient(180deg, var(--gold-soft) 0%, var(--surface) 62%); }
  .cap-top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
  .cap-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
  .cap-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; max-width: 640px; }
  .cap-figure {
    margin-left: auto; font-size: 21px; font-weight: 700; letter-spacing: -0.02em;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .cap-figure-sub { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .cap-bar { height: 7px; border-radius: 5px; background: var(--surface-3); overflow: hidden; display: flex; }
  .cap-bar span { display: block; height: 100%; background: var(--sage); border-radius: 5px 0 0 5px; transition: width 420ms cubic-bezier(0.32,0.72,0,1); }
  .cap-card.full .cap-bar span { background: var(--gold); }
  .cap-card.over .cap-bar span { background: var(--gold); }
  .cap-bar em { display: block; height: 100%; background: var(--rose); }
  .cap-legend { display: flex; gap: 16px; margin-top: 9px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .cap-legend span:last-child { margin-left: auto; }

  /* ================================================================ */
  /* ONBOARDING — splash, tour, setup                                 */
  /* ================================================================ */
  body.onboarding .app { display: none; }
  #onboarding-root:empty { display: none; }

  .ob {
    position: fixed; inset: 0; z-index: 700;
    display: flex; flex-direction: column;
    background: var(--ink); color: #F6F1E7;
    overflow: hidden;
  }
  .ob-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px; position: relative; z-index: 3;
  }
  .ob-brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .ob-mark {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--gold); position: relative;
  }
  .ob-mark::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 7px; height: 7px; border-radius: 50%; background: #F6F1E7;
  }
  .ob-mark.big {
    width: 62px; height: 62px; border-width: 4px; margin: 0 auto 30px;
    animation: obPulse 2.6s ease-in-out infinite;
  }
  .ob-mark.big::after { width: 18px; height: 18px; }
  @keyframes obPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 162, 74, 0.35); }
    50% { box-shadow: 0 0 0 22px rgba(212, 162, 74, 0); }
  }
  .ob-skip {
    font-size: 13px; color: rgba(246, 241, 231, 0.55);
    cursor: pointer; transition: color var(--transition);
  }
  .ob-skip:hover { color: #F6F1E7; }
  .ob-glow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,162,74,0.16) 0%, rgba(212,162,74,0) 68%);
    top: 44%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1;
    animation: obGlow 9s ease-in-out infinite;
  }
  @keyframes obGlow { 0%, 100% { opacity: 0.75; transform: translate(-50%,-50%) scale(1); }
                      50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } }

  .ob-hero {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; padding: 0 32px 60px;
    position: relative; z-index: 2; max-width: 900px; margin: 0 auto;
  }
  .ob-eyebrow {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); font-weight: 700; margin-bottom: 22px;
    animation: obUp 700ms cubic-bezier(0.32,0.72,0,1) both;
  }
  .ob-title {
    font-size: 62px; line-height: 1.04; font-weight: 700;
    letter-spacing: -0.038em; margin: 0 0 22px;
    animation: obUp 800ms cubic-bezier(0.32,0.72,0,1) 80ms both;
  }
  .ob-title span { color: var(--gold); }
  .ob-lede {
    font-size: 17px; line-height: 1.6; color: rgba(246, 241, 231, 0.7);
    max-width: 620px; margin: 0 0 34px;
    animation: obUp 800ms cubic-bezier(0.32,0.72,0,1) 160ms both;
  }
  .ob-cta { display: flex; gap: 12px; animation: obUp 800ms cubic-bezier(0.32,0.72,0,1) 240ms both; }
  .btn.lg { padding: 13px 22px; font-size: 14px; border-radius: 10px; }
  .ob:not(.ob-setup) .btn:not(.gold) {
    background: rgba(246, 241, 231, 0.08); color: #F6F1E7;
    border-color: rgba(246, 241, 231, 0.18);
  }
  .ob:not(.ob-setup) .btn:not(.gold):hover { background: rgba(246, 241, 231, 0.14); }
  .ob-setup .btn:not(.gold) {
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--border-strong);
  }
  .ob-setup .btn:not(.gold):hover { background: var(--surface-2); border-color: var(--gold); color: var(--ink); }
  .ob-setup .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .ob-setup .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .ob-proof {
    display: flex; gap: 38px; margin-top: 52px; flex-wrap: wrap; justify-content: center;
    animation: obUp 800ms cubic-bezier(0.32,0.72,0,1) 340ms both;
  }
  .ob-proof-item { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
  .ob-proof-item strong { color: var(--gold); font-weight: 600; }
  .ob-proof-item span { color: rgba(246, 241, 231, 0.5); }
  @keyframes obUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* ---- Tour ---- */
  .tour-stage {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 56px;
    align-items: center; padding: 0 64px 40px; max-width: 1240px; margin: 0 auto; width: 100%;
    position: relative; z-index: 2;
  }
  .tour-kicker {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); font-weight: 700; margin-bottom: 16px;
    animation: obUp 600ms cubic-bezier(0.32,0.72,0,1) both;
  }
  .tour-line {
    font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -0.032em;
    margin: 0 0 18px; animation: obUp 700ms cubic-bezier(0.32,0.72,0,1) 70ms both;
  }
  .tour-sub {
    font-size: 16px; line-height: 1.6; color: rgba(246, 241, 231, 0.68); margin: 0;
    animation: obUp 700ms cubic-bezier(0.32,0.72,0,1) 150ms both;
  }
  .tour-art { position: relative; min-height: 340px; display: flex; align-items: center; justify-content: center; }

  .tour-controls {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 32px 26px; position: relative; z-index: 3;
    max-width: 1240px; margin: 0 auto; width: 100%;
  }
  .tour-ctl {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(246, 241, 231, 0.09); border: 0; color: #F6F1E7;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background var(--transition);
  }
  .tour-ctl:hover { background: rgba(246, 241, 231, 0.18); }
  .tour-ctl .gi { width: 14px; height: 14px; }
  .tour-pause { width: 11px; height: 12px; border-left: 3px solid #F6F1E7; border-right: 3px solid #F6F1E7; }
  .tour-bars { flex: 1; display: flex; gap: 6px; margin: 0 10px; }
  .tour-bar { flex: 1; height: 3px; border-radius: 3px; background: rgba(246, 241, 231, 0.16); overflow: hidden; }
  .tour-bar.done { background: rgba(212, 162, 74, 0.55); }
  .tour-bar em { display: block; height: 100%; background: var(--gold); width: 0; animation: tourFill linear both; }
  .ob-tour.paused .tour-bar em, .ob-tour.paused .tour-art * { animation-play-state: paused; }
  @keyframes tourFill { to { width: 100%; } }
  .tour-count { font-size: 12px; color: rgba(246, 241, 231, 0.45); font-variant-numeric: tabular-nums; }

  /* Tour scene art */
  .tsc-bubbles { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .tsc-bubble {
    background: rgba(246, 241, 231, 0.07); border: 1px solid rgba(246, 241, 231, 0.1);
    border-radius: 14px 14px 14px 4px; padding: 13px 16px; font-size: 13.5px;
    color: rgba(246, 241, 231, 0.85); max-width: 92%;
    animation: obUp 520ms cubic-bezier(0.32,0.72,0,1) both;
  }
  .tsc-bubble:nth-child(even) { align-self: flex-end; border-radius: 14px 14px 4px 14px; }

  .tsc-orbit { position: relative; width: 100%; height: 320px; }
  .tsc-core {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center;
  }
  .tsc-core .tsc-dot { width: 26px; height: 26px; border-radius: 50%; background: #F6F1E7; }
  .tsc-core .tsc-ring {
    position: absolute; inset: -18px; border-radius: 50%;
    border: 1px solid rgba(212, 162, 74, 0.3);
    animation: obPulse 2.4s ease-in-out infinite;
  }
  .tsc-chip {
    position: absolute; font-size: 12px; padding: 7px 13px; border-radius: 20px;
    background: rgba(246, 241, 231, 0.08); border: 1px solid rgba(246, 241, 231, 0.14);
    color: rgba(246, 241, 231, 0.9); white-space: nowrap;
    animation: tscIn 900ms cubic-bezier(0.32,0.72,0,1) both;
  }
  @keyframes tscIn { from { opacity: 0; transform: scale(0.9) translate(var(--dx, 0), var(--dy, 0)); } to { opacity: 1; transform: none; } }
  .tsc-chip-0 { top: 6%;  left: 4%;  --dx: 40px;  --dy: 40px; }
  .tsc-chip-1 { top: 20%; right: 2%; --dx: -40px; --dy: 30px; }
  .tsc-chip-2 { bottom: 20%; left: 0; --dx: 46px;  --dy: -30px; }
  .tsc-chip-3 { bottom: 4%; right: 10%; --dx: -30px; --dy: -36px; }
  .tsc-chip-4 { top: 46%; left: -2%;  --dx: 50px;  --dy: 0; }
  .tsc-chip-5 { top: 44%; right: -2%; --dx: -50px; --dy: 0; }

  .tsc-card {
    background: rgba(246, 241, 231, 0.055); border: 1px solid rgba(246, 241, 231, 0.12);
    border-radius: 16px; padding: 20px; width: 100%;
    animation: obUp 600ms cubic-bezier(0.32,0.72,0,1) both;
  }
  .tsc-q { font-size: 12.5px; color: rgba(246, 241, 231, 0.55); margin-bottom: 12px; }
  .tsc-a { font-size: 14.5px; line-height: 1.6; color: #F6F1E7; }
  .tsc-type {
    display: inline-block; overflow: hidden; white-space: normal;
    animation: tscType 2.2s steps(60) both;
  }
  @keyframes tscType { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .tsc-src { display: flex; gap: 7px; margin-top: 14px; flex-wrap: wrap; }
  .tsc-src span {
    font-size: 10.5px; padding: 4px 9px; border-radius: 6px;
    background: rgba(212, 162, 74, 0.15); color: var(--gold);
    animation: obUp 500ms ease both;
  }
  .tsc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; animation: obUp 500ms ease both; }
  .tsc-tag {
    font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 700;
    padding: 4px 9px; border-radius: 5px; background: rgba(212,162,74,0.18); color: var(--gold);
  }
  .tsc-tag.flag { background: rgba(183, 87, 87, 0.22); color: #E8A0A0; }
  .tsc-btn {
    margin-left: auto; font-size: 11px; padding: 5px 11px; border-radius: 7px;
    background: rgba(246,241,231,0.08); color: rgba(246,241,231,0.75);
  }
  .tsc-btn + .tsc-btn { margin-left: 0; }
  .tsc-btn.approve { background: rgba(96,123,103,0.45); color: #DCEBE0; }
  .tsc-btn.hold { background: rgba(183,87,87,0.4); color: #F3D8D8; }
  .tsc-quote { font-size: 13px; font-style: italic; color: rgba(246,241,231,0.8); margin: 0 0 16px; line-height: 1.55; }
  .tsc-quote.muted { color: rgba(246,241,231,0.42); margin-bottom: 8px; }
  .tsc-held { font-size: 11.5px; color: #E8A0A0; animation: obUp 500ms ease 1.3s both; }

  .tsc-modes { display: flex; flex-direction: column; gap: 14px; width: 100%; }
  .tsc-mode {
    background: rgba(246,241,231,0.055); border: 1px solid rgba(246,241,231,0.12);
    border-radius: 13px; padding: 15px 17px; animation: obUp 600ms cubic-bezier(0.32,0.72,0,1) both;
  }
  .tsc-mode-name { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .tsc-meter { height: 5px; border-radius: 4px; background: rgba(246,241,231,0.12); overflow: hidden; }
  .tsc-meter span {
    display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--sage), var(--gold));
    animation: tscMeter 900ms cubic-bezier(0.32,0.72,0,1) both;
  }
  @keyframes tscMeter { from { width: 0 !important; } }

  .tsc-task {
    display: flex; align-items: center; gap: 11px; padding: 10px 0;
    border-bottom: 1px solid rgba(246,241,231,0.08); font-size: 13.5px;
    animation: obUp 500ms ease both;
  }
  .tsc-check {
    width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid rgba(246,241,231,0.3);
    animation: tscCheck 400ms ease both; flex-shrink: 0;
  }
  @keyframes tscCheck { to { background: var(--sage); border-color: var(--sage); } }
  .tsc-est {
    margin-left: auto; font-size: 11.5px; color: var(--gold);
    background: rgba(212,162,74,0.14); padding: 3px 8px; border-radius: 6px;
  }
  .tsc-cap { font-size: 12.5px; color: rgba(246,241,231,0.7); margin-top: 14px; animation: obUp 500ms ease both; }
  .tsc-cap strong { color: #E8A0A0; }

  /* ---- Setup ---- */
  .ob-setup { background: var(--bg); color: var(--ink); }
  .ob-setup .ob-brand { color: var(--ink); }
  .ob-setup .ob-mark::after { background: var(--ink); }
  .ob-setup .ob-skip { color: var(--muted); }
  .ob-setup .ob-skip:hover { color: var(--ink); }
  .setup-wrap { flex: 1; overflow-y: auto; width: 100%; max-width: 860px; margin: 0 auto; padding: 8px 32px 40px; }
  .setup-steps { display: flex; gap: 26px; margin-bottom: 30px; flex-wrap: wrap; }
  .setup-step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted-2); }
  .setup-step.live { color: var(--ink); font-weight: 600; }
  .setup-step.done { color: var(--sage); }
  .setup-step-num {
    width: 21px; height: 21px; border-radius: 50%; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-3); color: var(--muted);
  }
  .setup-step.live .setup-step-num { background: var(--gold); color: #FFF; }
  .setup-step.done .setup-step-num { background: var(--sage-soft); color: var(--sage); }
  .setup-title { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 10px; }
  .setup-lede { font-size: 14.5px; color: var(--muted); line-height: 1.6; margin: 0 0 24px; max-width: 640px; }
  .setup-sources { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setup-source {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 11px; padding: 13px 15px; cursor: pointer;
    transition: all var(--transition);
  }
  .setup-source:hover { border-color: var(--border-strong); }
  .setup-source.on { border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft) 0%, var(--surface) 70%); }
  .setup-source-name { font-size: 13.5px; font-weight: 600; }
  .setup-source-desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .setup-source .source-toggle { margin-left: auto; }
  .setup-note {
    display: flex; align-items: center; gap: 9px; margin-top: 20px;
    font-size: 12.5px; color: var(--muted); background: var(--surface-2);
    border-radius: 10px; padding: 12px 14px;
  }
  .setup-note .gi { color: var(--muted-2); margin: 0; }
  .setup-voice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .setup-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--border);
  }

  @media (max-width: 1000px) {
    .tour-stage { grid-template-columns: 1fr; gap: 28px; padding: 0 32px 24px; }
    .tour-art { min-height: 220px; }
    .ob-title { font-size: 42px; }
    .tour-line { font-size: 32px; }
    .setup-sources { grid-template-columns: 1fr; }
  }
  .replay-tour {

function uid(p) { return p + (++S.seq); }

/* Item states:
   pending / approved / held  → still in today's batch (awaiting publish)
   auto      → published automatically by the mode
   published → published because you approved it
   dropped   → you held it and published the batch; never goes live       */
const BATCH = ["pending", "approved", "held"];

/* Apply the trust mode to every digest item. Called on load and on mode change. */
function applyMode(initial) {
  S.digest.forEach(d => {
    if (d.locked) return;                       // user already decided this one
    const risky = d.cat === "flagged" || d.sensitive;
    if (S.mode === "ambient")       d.state = risky ? "dropped" : "published";
    else if (S.mode === "balanced") d.state = d.routine ? "auto" : defaultDecision(d);
    else                            d.state = defaultDecision(d);
  });
  if (!initial) renderAll();
}

/* Balanced pre-recommends a decision you can override. Curated decides nothing for you. */
function defaultDecision(d) {
  if (d.cat === "flagged" || d.sensitive) return "held";
  return S.mode === "curated" ? "pending" : "approved";
}

function inBatch(d) { return BATCH.indexOf(d.state) > -1; }
function pendingCount() { return S.digest.filter(inBatch).length; }
function publishedItems() { return S.digest.filter(d => d.state === "published" || d.state === "auto"); }
function heldCount() { return S.digest.filter(d => d.state === "held").length; }

function bootData() {
  S.digest = DIGEST_SEED.map(d => Object.assign({}, d, { aud: Object.assign({}, d.aud), state: "pending", locked: false }));

  S.history = HISTORY_SEED.slice();

}

/* ---------------- Navigation ---------------- */
function go(key, opts) {
  if (!SCREENS[key]) return;
  closeOverlay();                        // never leave a modal or menu orphaned behind a screen change
  if (key !== "tickets") S.openTicket = null;
  if (opts && opts.ticket) S.openTicket = opts.ticket;
  S.screen = key;
  renderAll();
  const c = $("#content"); if (c) c.scrollTop = 0;
}

function renderNav() {
  let h = "";
  NAV.forEach(g => {
    const items = g.items.filter(i => !i.only || i.only === S.mode);
    if (!items.length) return;
    h += '<div class="nav-group">';
    if (g.group) h += '<div class="nav-group-label">' + g.group + "</div>";
    items.forEach(i => {
      const n = i.count ? i.count() : null;
      const showCount = n !== null && n > 0;
      h += '<div class="nav-item' + (S.screen === i.key ? " active" : "") + '" data-go="' + i.key + '">' +
             '<span class="nav-icon">' + ICON[i.icon] + "</span>" + i.label +
             (showCount ? '<span class="nav-count' + (i.alert ? " nav-count-alert" : "") + '">' + n + "</span>" : "") +
           "</div>";
    });
    h += "</div>";
  });
  $("#nav-root").innerHTML = h;
}

function renderTop() {
  $("#breadcrumb").innerHTML = (CRUMB[S.screen] || (() => ""))();
  const chip = $("#status-chip");
  if (S.privacy) { chip.classList.add("private"); chip.innerHTML = '<span class="status-dot"></span> Private'; }
  else { chip.classList.remove("private"); chip.innerHTML = '<span class="status-dot"></span> Active'; }
}

function renderAll() {
  renderNav();
  renderTop();
  $("#screen-root").innerHTML = SCREENS[S.screen]();
  if (AFTER[S.screen]) AFTER[S.screen]();
}

/* ---------------- Toast ---------------- */
function toast(msg, action) {
  const host = $("#toast-host");
  while (host.children.length >= 3) host.firstChild.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="toast-icon">' + ICON.check + "</span><div>" + msg + "</div>" +
    (action ? '<span class="toast-action">' + esc(action.label) + "</span>" : "");
  host.appendChild(el);
  if (action) $(".toast-action", el).addEventListener("click", () => { action.fn(); dismiss(); });
  const dismiss = () => { el.classList.add("out"); setTimeout(() => el.remove(), 240); };
  setTimeout(dismiss, action ? 6000 : 3600);
}

/* ---------------- Overlays ---------------- */
function closeOverlay() { $("#overlay-root").innerHTML = ""; }

function modal(cfg) {
  const root = $("#overlay-root");
  root.innerHTML =
    '<div class="modal-scrim" data-close="1"><div class="modal">' +
      '<div class="modal-head"><h3 class="modal-title">' + cfg.title + "</h3>" +
        (cfg.sub ? '<p class="modal-sub">' + cfg.sub + "</p>" : "") + "</div>" +
      '<div class="modal-body">' + cfg.body + "</div>" +
      '<div class="modal-foot">' +
        '<button class="btn ghost" data-close="1">' + (cfg.cancel || "Cancel") + "</button>" +
        '<button class="btn gold" id="modal-ok">' + (cfg.ok || "Save") + "</button>" +
      "</div></div></div>";
  root.addEventListener("click", e => { if (e.target.dataset.close) closeOverlay(); });
  $("#modal-ok").addEventListener("click", () => { if (cfg.onOk) cfg.onOk(); });
  const f = $(".modal-body input, .modal-body textarea"); if (f) setTimeout(() => f.focus(), 60);
}

function menu(anchor, groups, onPick) {
  closeOverlay();
  const r = anchor.getBoundingClientRect();
  let h = '<div class="menu" style="top:' + (r.bottom + 6) + "px; left:" + Math.min(r.left, window.innerWidth - 210) + 'px">';
  groups.forEach(g => {
    if (g.label) h += '<div class="menu-label">' + g.label + "</div>";
    g.opts.forEach(o => {
      h += '<div class="menu-item' + (o.active ? " active" : "") + '" data-val="' + esc(o.val) + '">' +
        (o.av ? '<span class="menu-avatar ' + o.av + '">' + o.initials + "</span>" : "") +
        (o.dot ? '<span class="status-pill ' + o.dot + '" style="padding:2px 7px">' + o.label + "</span>" : esc(o.label)) +
        "</div>";
    });
  });
  h += "</div>";
  const root = $("#overlay-root");
  root.innerHTML = '<div style="position:fixed;inset:0;z-index:399" data-close="1"></div>' + h;
  root.addEventListener("click", e => {
    if (e.target.dataset.close) return closeOverlay();
    const it = e.target.closest(".menu-item");
    if (it) { closeOverlay(); onPick(it.dataset.val); }
  });
}

/* ---------------- Command palette ---------------- */
let paletteSel = 0, paletteRows = [];

function paletteData(q) {
  const rows = [];
  const query = q.trim().toLowerCase();
  const push = (label, kind, icon, fn) => rows.push({ label, kind, icon, fn });
  const screens = [["my-halo","My Halo"],["digest","Daily Digest"],["team","Team"],["ask","Ask Halo"],["history","History"],
                   ["calendar","Calendar"],["tickets","Tickets"],["sources","Sources"],["voice","Voice & Privacy"],
                   ["book","Book Time"],["meeting","Meeting Recap"],["goal","Goal Decomposition"],["quick-add","Quick Add"]];
  if (S.mode === "ambient") screens.splice(2, 0, ["activity", "Activity Log"]);
  screens.forEach(([k, l]) => { if (!query || l.toLowerCase().includes(query)) push(l, "Go to", "chevron", () => go(k)); });
  S.tickets.forEach(t => { if (query && t.title.toLowerCase().includes(query)) push(t.title, "Ticket", "ticket", () => go("tickets", { ticket: t.id })); });
  PEOPLE.forEach(p => { if (query && p.name.toLowerCase().includes(query)) push(p.name, "Ask their Halo", "chat", () => { S.chatPerson = p.id; S.chat = []; go("ask"); }); });
  Object.keys(MODES).forEach(m => {
    if (query && MODES[m].name.toLowerCase().includes(query)) push("Switch to " + MODES[m].name + " mode", "Mode", "spark", () => { setMode(m); go("voice"); });
  });
  return rows.slice(0, 9);
}

function renderPalette(q) {
  paletteRows = paletteData(q);
  if (paletteSel >= paletteRows.length) paletteSel = 0;
  const list = paletteRows.length
    ? paletteRows.map((r, i) =>
        '<div class="palette-row' + (i === paletteSel ? " sel" : "") + '" data-i="' + i + '">' +
        '<span class="palette-row-icon">' + ICON[r.icon] + "</span>" + esc(r.label) +
        '<span class="palette-row-kind">' + r.kind + "</span></div>").join("")
    : '<div class="palette-empty">Nothing matches “' + esc(q) + "”</div>";
  $("#palette-results").innerHTML = list;
}

function openPalette() {
  paletteSel = 0;
  $("#overlay-root").innerHTML =
    '<div class="palette-scrim" data-close="1"><div class="palette">' +
      '<div class="palette-input-row">' + ICON.search +
        '<input class="palette-input" id="palette-input" placeholder="Search screens, tickets, people…" autocomplete="off" />' +
      "</div>" +
      '<div class="palette-results" id="palette-results"></div>' +
      '<div class="palette-foot"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>' +
    "</div></div>";
  renderPalette("");
  const input = $("#palette-input");
  input.focus();
  input.addEventListener("input", () => { paletteSel = 0; renderPalette(input.value); });
  $("#overlay-root").addEventListener("click", e => {
    if (e.target.dataset.close) return closeOverlay();
    const row = e.target.closest(".palette-row");
    if (row) { const fn = paletteRows[+row.dataset.i].fn; closeOverlay(); fn(); }
  });
}

/* ---------------- Sound (ticket completion) ---------------- */
let audioCtx;
function chime(up) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "sine"; osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(up ? 880 : 660, t);
    osc.frequency.exponentialRampToValueAtTime(up ? 1320 : 440, t + 0.08);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    osc.start(t); osc.stop(t + 0.24);
  } catch (e) {}
}

/* ---------------- Time ---------------- */
function nowLabel() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function logActivity(kind, text, meta) {
  S.activity.unshift({ id: uid("a"), kind, text, meta, time: nowLabel() });
  if (S.activity.length > 24) S.activity.length = 24;
}

/* ---------- Voice composition: dials genuinely change the output ---------- */
function joinFrags(list) {
  if (!list.length) return "";
  if (list.length === 1) return list[0];
  if (list.length === 2) return list[0] + ", and " + list[1];
  return list.slice(0, -1).join(", ") + ", and " + list[list.length - 1];
}

function composeHero(aud) {
  const key = aud === "exec" ? "heroExec" : "hero";
  const pub = publishedItems().filter(d => d.aud[aud] && d[key]);
  const d = S.dials;
  const maxFrag = d.length < 30 ? 1 : d.length < 62 ? 2 : 3;
  const work  = pub.filter(x => x.cat !== "availability").map(x => x[key]).slice(0, maxFrag);
  const avail = pub.filter(x => x.cat === "availability").map(x => x[key])[0];

  if (!work.length) {
    const base = aud === "exec"
      ? "Active on research work and supporting a client integration. On track."
      : "Focused on a few active projects this week and supporting an integration kickoff on the side. Making good progress, nothing blocked.";
    return base + (avail ? " " + cap(avail) + "." : " Free for standup Thursday, and open to quick syncs after 3 most afternoons.");
  }

  const opener = d.formality > 62
    ? (aud === "exec" ? "This week: " : "Currently focused on ")
    : d.formality < 32 ? "Right now — " : "";
  let s = opener + joinFrags(work) + ".";
  if (d.certainty < 30) s = s.replace(/\.$/, " — at least that's the shape of it today.");
  if (avail && d.length > 34) s += " " + cap(avail) + ".";
  if (d.warmth > 70) s += aud === "exec" ? " Happy to go deeper on any of it." : " Ping me if you need anything sooner.";
  return cap(s);
}

function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

/* ---------- The standup, answered ----------
   The core scenario from the concept doc: a manager asks what you did,
   what you're on today, and whether anything is blocked — without a meeting.
   Composed live from published signal and your tickets.                     */
function standupAnswer() {
  const pub = publishedItems();
  const done = S.tickets.filter(t => t.status === "done");
  const blocked = S.tickets.filter(t => t.status === "blocked");
  const today = S.tickets.filter(t => t.status !== "done" && t.status !== "blocked" && (t.due === "Today" || t.status === "progress"));

  const yesterday = [];
  done.slice(0, 2).forEach(t => yesterday.push("Finished " + lower(t.title)));
  pub.filter(d => d.cat === "work" || d.cat === "doc").slice(0, 2 - yesterday.length).forEach(d => yesterday.push(cap(d.hero || lower(d.text))));
  if (!yesterday.length) yesterday.push("Nothing published yet — approve today's digest and this fills in");

  const now = [];
  today.slice(0, 3).forEach(t => now.push(cap(lower(t.title)) + (t.due === "Today" ? " — due today" : "")));
  const focus = S.schedule.find(e => e.focus);
  if (focus && now.length < 3) now.push(focus.title.replace("Focus block — ", "Focus block: "));
  if (!now.length) now.push("Nothing scheduled — your ticket list is clear");

  const blocks = blocked.map(t => lower(t.title) + " — waiting on " +
    ((t.subtasks.find(s => s.who && s.who !== "matias") || {}).who ? person((t.subtasks.find(s => s.who && s.who !== "matias") || {}).who).name.split(" ")[0] : "a decision"));

  return { yesterday, today: now, blocked: blocks };
}
function lower(t) { return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

/* Which signals produced the summary currently on screen */
function heroSources(aud) {
  const key = aud === "exec" ? "heroExec" : "hero";
  return publishedItems().filter(d => d.aud[aud] && d[key]).slice(0, 5);
}

function redactedCount() {
  return S.digest.filter(d => (inBatch(d) || d.state === "dropped") && (d.sensitive || !d.aud[S.heroAud])).length;
}

function tagClass(cat) {
  return cat === "meeting" ? "meeting" : cat === "availability" ? "availability" : cat === "flagged" ? "flagged-tag" : "design";

function digestCard(d) {
  const decided = d.state === "approved" || d.state === "held";
  const cls = "digest-item" + (d.cat === "flagged" ? " flagged" : "") +
    (d.state === "approved" ? " resolved-approve" : d.state === "held" ? " resolved-hold" : "");

  const editing = S.editing === d.id;
  const preview = editing
    ? '<div class="digest-item-preview"><div class="digest-preview-label">Edit what Halo will say:</div>' +
        '<textarea class="digest-edit-area" id="edit-' + d.id + '">' + esc(d.text) + "</textarea>" +
        '<div class="digest-edit-actions"><button class="btn gold sm" data-save-edit="' + d.id + '">Save</button>' +
        '<button class="btn ghost sm" data-cancel-edit="1">Cancel</button></div></div>'

        (d.cat === "flagged" ? "Halo drafted:" : "Halo will say, in your voice:") + "</div>“" + esc(d.text) + "”</div>";

  const aud = '<div class="digest-item-audience">Visible to ' +
    [["team", "Team"], ["manager", "Manager"], ["exec", "Exec"]].map(([k, l]) =>
      '<span class="digest-aud' + (d.aud[k] ? " on" : "") + '" data-aud-toggle="' + d.id + ":" + k + '">' + l + "</span>").join(" ") +
    "</div>";

  return '<div class="' + cls + '" id="di-' + d.id + '">' +
    '<div class="digest-item-head"><div class="digest-item-what">' +
      '<span class="digest-tag ' + tagClass(d.cat) + '">' + (d.cat === "flagged" ? ic("warn") : "") + esc(d.tag.toLowerCase().replace(/^./, c => c.toUpperCase())) + "</span>" +
      '<span class="digest-item-source">From ' + esc(d.src) + " · " + (d.conf === "low" ? "low confidence, possibly sensitive" : "high confidence") + "</span>" +
    "</div>" +
    '<div class="digest-decision">' +
      '<button class="digest-btn approve' + (d.state === "approved" ? " active" : "") + '" data-decide="' + d.id + ':approved">✓ Approve</button>' +
      '<button class="digest-btn edit" data-edit="' + d.id + '">Edit</button>' +
      '<button class="digest-btn hold' + (d.state === "held" ? " active" : "") + '" data-decide="' + d.id + ':held">Hold</button>' +
    "</div></div>" +
    preview +
    (d.cat === "flagged" ? '<div class="digest-flag-note">' + ic("warn") + esc(d.flagNote) + "</div>" : "") +
    (d.why && S.mode === "balanced"
      ? '<div class="digest-why">' + ICON.info + " Held for you: " + esc(d.why) + "</div>" : "") +
    (d.edited ? '<div class="digest-why">' + ICON.info + " Edited by you — Halo will use your wording.</div>" : "") +
    aud + "</div>";
}

/* ============================== ASK HALO ============================== */
function answerFor(pid, q) {
  const h = halo(pid), ql = q.toLowerCase();
  let best = null, bestScore = 0;
  h.qa.forEach(item => {
    const score = item.k.reduce((n, k) => n + (ql.includes(k) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; best = item; }
  });
  if (best) return { a: best.a, s: best.s };
  return { a: h.summary + (h.avail ? " " + h.avail : "") + " If you need more than that, I'd ask them directly — Halo only speaks to what it can source.",
           s: h.sources.slice(0, 2).concat(["Halo · low confidence"]) };
}

function sendChat(text) {
  text = (text || "").trim();
  if (!text) return;
  const pid = S.chatPerson;
  S.chat.push({ who: "you", text, time: "just now" });
  S.chat.push({ who: "halo", typing: true });
  renderAll();
  setTimeout(() => {
    const i = S.chat.findIndex(m => m.typing);
    const res = answerFor(pid, text);
    S.chat[i] = { who: "halo", person: pid, text: res.a, src: res.s, time: "just now" };
    renderAll();
  }, 900);
}

/* ============================== CALENDAR ============================== */
const CAL_DAYS = [
  { name: "Mon", num: 4 }, { name: "Tue", num: 5 }, { name: "Wed", num: 6, today: true },
  { name: "Thu", num: 7 }, { name: "Fri", num: 8 }
];
function dayIndexFor(t) {
  const d = (t.due || "").toLowerCase();
  if (d.includes("today")) return 2;
  if (d.includes("aug 4")) return 0;
  if (d.includes("aug 5")) return 1;
  if (d.includes("aug 7")) return 3;
  if (d.includes("aug 8")) return 4;
  return -1;
}
function calClass(t) {
  if (t.status === "done") return "done";
  if (t.tag === "Open question") return "question";
  if (t.tag === "Coordination") return "coordination";
  if (t.tag === "Backend") return "backend";
  return "design";
}

SCREENS["calendar"] = function () {

    return '<div class="cal-day' + (d.today ? " today" : "") + '">' +
      '<div class="cal-day-header"><span class="cal-day-name">' + d.name + "</span>" +
