<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halo — High Fidelity Prototype</title>
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --surface-2: #F5F1EA;
    --surface-3: #EFEAE0;
    --ink: #0F1729;
    --ink-2: #1F2937;
    --muted: #6B7280;
    --muted-2: #9CA3AF;
    --faint: #C7BDA9;
    --border: #E8E1D3;
    --border-strong: #D4C9B2;
    --gold: #D4A24A;
    --gold-soft: #F4E8CE;
    --gold-hover: #B88839;
    --sage: #607B67;
    --sage-soft: #E4EDE7;
    --rose: #B75757;
    --rose-soft: #F2DFDF;
    --shadow-sm: 0 1px 2px rgba(15, 23, 41, 0.04);
    --shadow-md: 0 2px 8px rgba(15, 23, 41, 0.06);
    --shadow-lg: 0 8px 24px rgba(15, 23, 41, 0.08);
    --radius: 8px;
    --radius-lg: 12px;
    --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
  }
  ::selection { background: var(--gold-soft); color: var(--ink); }

  /* ================================================================ */
  /* APP SHELL */
  /* ================================================================ */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 24px;
    font-weight: 700; font-size: 17px;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid var(--gold);
    position: relative;
    background: transparent;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ink);
  }
  .nav-group {
    display: flex; flex-direction: column; gap: 2px;
    margin-bottom: 16px;
  }
  .nav-group-label {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted-2); font-weight: 600;
    padding: 6px 12px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--ink-2);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
    user-select: none;
  }
  .nav-item:hover { background: rgba(15, 23, 41, 0.04); }
  .nav-item.active {
    background: var(--ink);
    color: #FFF;
    font-weight: 500;
  }
  .nav-item.active .nav-icon { color: var(--gold); }
  .nav-icon {
    width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
  }
  .nav-item.active .nav-icon { color: var(--gold); }
  .nav-count {
    margin-left: auto;
    font-size: 11px;
    background: var(--surface-3);
    color: var(--muted);
    padding: 1px 7px;
    border-radius: 999px;
    font-weight: 500;
  }
  .nav-item.active .nav-count { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

  .fab {
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px;
    background: var(--gold);
    color: var(--ink);
    font-size: 13.5px; font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 2px 8px rgba(212, 162, 74, 0.35);
  }
  .fab:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212, 162, 74, 0.45); }
  .fab-icon { width: 16px; height: 16px; position: relative; }
  .fab-icon::before, .fab-icon::after {
    content: ""; position: absolute; background: var(--ink);
  }
  .fab-icon::before { top: 7px; left: 0; width: 16px; height: 2px; border-radius: 1px; }
  .fab-icon::after { top: 0; left: 7px; width: 2px; height: 16px; border-radius: 1px; }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .user-chip:hover { background: rgba(15, 23, 41, 0.04); cursor: pointer; }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #B7A57A 0%, #8A7548 100%);
    color: #FFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3px var(--gold);
  }
  .user-name { font-weight: 500; color: var(--ink); }
  .user-role { font-size: 11px; color: var(--muted); }

  /* Main area */
  .main {
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px;
    background: rgba(250, 247, 242, 0.85);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .breadcrumb .crumb-sep { color: var(--faint); }
  .breadcrumb .crumb-muted { color: var(--muted); font-weight: 400; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .status-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    background: var(--sage-soft);
    color: var(--sage);
    border: 1px solid rgba(96, 123, 103, 0.2);
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: background var(--transition);
  }
  .status-chip:hover { background: rgba(96, 123, 103, 0.15); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--sage);
    box-shadow: 0 0 0 3px rgba(96, 123, 103, 0.2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(96, 123, 103, 0.2); }
    50% { box-shadow: 0 0 0 5px rgba(96, 123, 103, 0.1); }
  }
  .status-chip.private { background: var(--rose-soft); color: var(--rose); border-color: rgba(183, 87, 87, 0.2); }
  .status-chip.private .status-dot { background: var(--rose); box-shadow: 0 0 0 3px rgba(183, 87, 87, 0.2); animation: none; }
  .search-input {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px; width: 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px; color: var(--muted-2);
    cursor: text;
    transition: border-color var(--transition);
  }
  .search-input:hover { border-color: var(--border-strong); }
  .search-icon-svg { width: 14px; height: 14px; opacity: 0.6; }
  .kbd {
    margin-left: auto;
    padding: 1px 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted);
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
  }
  .content-inner { max-width: 1080px; margin: 0 auto; }

  .page-header { margin-bottom: 28px; }
  .page-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .page-sub { font-size: 14.5px; color: var(--muted); margin: 0; max-width: 600px; }

  /* Screens */
  .screen { display: none; animation: fadeIn 240ms ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ================================================================ */
  /* SHARED COMPONENTS */
  /* ================================================================ */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition);
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); margin: 0;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted-2); }
  .btn.primary {
    background: var(--ink);
    color: #FFF;
    border-color: var(--ink);
  }
  .btn.primary:hover { background: var(--ink-2); }
  .btn.gold {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
    font-weight: 600;
  }
  .btn.gold:hover { background: var(--gold-hover); border-color: var(--gold-hover); color: #FFF; }
  .btn.ghost { border: 1px solid transparent; color: var(--muted); background: transparent; }
  .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  .audience-switch {
    display: inline-flex; padding: 3px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; gap: 2px;
  }
  .aud {
    padding: 6px 14px; font-size: 12.5px; color: var(--muted);
    border-radius: 6px; cursor: pointer; font-weight: 500;
    transition: all var(--transition);
  }
  .aud:hover { color: var(--ink); }
  .aud.active {
    background: var(--surface); color: var(--ink); font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  .voice-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px;
    background: linear-gradient(135deg, var(--gold-soft) 0%, #E8DBB8 100%);
    color: #7A5A1E;
    border-radius: 4px;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    border: 1px solid rgba(212, 162, 74, 0.3);
  }
  .voice-badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip.redacted {
    background: var(--rose-soft);
    color: var(--rose);
    border: 1px solid rgba(183, 87, 87, 0.2);
  }

  /* ================================================================ */
  /* MY HALO — Dashboard */
  /* ================================================================ */
  .hero-card {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .hero-card::before {
    content: ""; position: absolute; top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%);
    opacity: 0.6;
    pointer-events: none;
  }
  .hero-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 18px;
    position: relative;
  }
  .hero-header h2 {
    font-size: 20px; font-weight: 700; margin: 0;
    letter-spacing: -0.015em;
  }
  .hero-header .hero-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .hero-response {
    font-size: 16px; line-height: 1.65; color: var(--ink);
    margin-bottom: 18px;
    position: relative;
  }
  .hero-meta {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: relative;
  }

  .dashboard-grid {
    display: grid; grid-template-columns: 1.4fr 1fr;
    gap: 20px;
  }

  .work-item {
    display: grid; grid-template-columns: 32px 1fr auto;
    gap: 12px; align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .work-item:last-child { border-bottom: none; }
  .work-icon {
    width: 32px; height: 32px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .work-name { font-size: 14px; font-weight: 500; }
  .work-source { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .work-status {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .work-status.active { background: var(--sage-soft); color: var(--sage); }
  .work-status.waiting { background: var(--gold-soft); color: #7A5A1E; }
  .work-status.blocked { background: var(--rose-soft); color: var(--rose); }
  .work-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .cal-slot { display: grid; grid-template-columns: 60px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .cal-slot:last-child { border-bottom: none; }
  .cal-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 500; }
  .cal-event-title { font-weight: 500; }
  .cal-event-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .cal-focus {
    padding: 8px 12px;
    background: linear-gradient(90deg, var(--sage-soft) 0%, transparent 100%);
    border-left: 3px solid var(--sage);
    border-radius: 3px;
    font-size: 12.5px;
    color: var(--sage);
    font-weight: 500;
  }

  /* ================================================================ */
  /* TEAM */
  /* ================================================================ */
  .team-layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; }
  .team-nav { display: flex; flex-direction: column; gap: 2px; }
  .team-nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--ink-2);
    cursor: pointer;
    transition: background var(--transition);
  }
  .team-nav-item:hover { background: rgba(15, 23, 41, 0.03); }
  .team-nav-item.active {
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .team-nav-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .person-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .person-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border-strong); }
  .person-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  .person-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #FFF;
    flex-shrink: 0;
  }
  .avatar-1 { background: linear-gradient(135deg, #6B7DB7 0%, #4B5B92 100%); }
  .avatar-2 { background: linear-gradient(135deg, #B7A57A 0%, #8A7548 100%); }
  .avatar-3 { background: linear-gradient(135deg, #7BA890 0%, #5A7D6B 100%); }
  .avatar-4 { background: linear-gradient(135deg, #B7748C 0%, #8A4E63 100%); }
  .avatar-5 { background: linear-gradient(135deg, #8878B0 0%, #5F4F87 100%); }
  .avatar-6 { background: linear-gradient(135deg, #B79268 0%, #8A6A44 100%); }
  .person-name { font-weight: 600; font-size: 15px; margin: 0; }
  .person-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .person-summary {
    font-size: 13.5px; color: var(--ink-2); line-height: 1.55;
    min-height: 42px; margin-bottom: 14px;
  }
  .person-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .person-actions { display: flex; gap: 6px; }

  /* ================================================================ */
  /* ASK HALO */
  /* ================================================================ */
  .chat-layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; height: calc(100vh - 180px); }
  .chat-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 16px; }
  .chat-msg { display: flex; gap: 12px; margin-bottom: 20px; }
  .chat-msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #FFF;
    flex-shrink: 0;
  }
  .chat-msg-avatar.you { background: linear-gradient(135deg, #6B7DB7 0%, #4B5B92 100%); }
  .chat-msg-avatar.halo {
    background: radial-gradient(circle at 35% 30%, var(--gold) 0%, var(--gold-hover) 70%, var(--ink) 100%);
    box-shadow: 0 0 0 2px var(--gold-soft);
  }
  .chat-msg-body { flex: 1; }
  .chat-msg-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 600; color: var(--muted-2);
    margin-bottom: 6px;
  }
  .chat-msg-name { color: var(--muted); }
  .chat-msg-time { color: var(--faint); font-weight: 400; }
  .chat-bubble {
    padding: 14px 16px;
    background: var(--surface-2);
    border-radius: 8px;
    font-size: 14.5px; line-height: 1.6;
  }
  .chat-msg.you-msg .chat-bubble { background: var(--ink); color: #FFF; }
  .chat-bubble.halo-response { background: var(--surface); border: 1px solid var(--border); }
  .chat-sources {
    margin-top: 10px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--muted);
  }
  .source-chip {
    padding: 3px 8px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; font-size: 11px; color: var(--ink-2); font-weight: 500;
    cursor: pointer; transition: background var(--transition);
  }
  .source-chip:hover { background: var(--surface-3); }
  .chat-input-area {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color var(--transition);
  }
  .chat-input-area:focus-within { border-color: var(--gold); background: var(--surface); }
  .chat-input-area input {
    flex: 1; background: transparent; border: 0; outline: 0;
    font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .chat-input-area input::placeholder { color: var(--muted-2); }
  .send-btn {
    width: 32px; height: 32px; border-radius: 6px;
    background: var(--ink); color: #FFF; border: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background var(--transition);
  }
  .send-btn:hover { background: var(--gold); color: var(--ink); }

  .chat-sidebar {
    display: flex; flex-direction: column; gap: 16px;
  }
  .person-summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }
  .person-summary-header {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .sidebar-action-row { display: flex; gap: 6px; }
  .sidebar-section { margin-top: 14px; }
  .sidebar-section-title {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px;
  }
  .visibility-note {
    padding: 10px 12px;
    background: var(--gold-soft);
    border-left: 3px solid var(--gold);
    border-radius: 3px;
    font-size: 12px; color: #7A5A1E; line-height: 1.5;
  }

  /* ================================================================ */
  /* VOICE / PERSONALIZE */
  /* ================================================================ */
  .voice-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }

  .preview-card {
    background: linear-gradient(135deg, var(--surface) 0%, #FDFBF7 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    box-shadow: var(--shadow-sm);
  }
  .preview-example {
    display: flex; gap: 12px;
    padding: 16px;
    background: var(--surface-2);
    border-radius: 10px;
    margin-top: 12px;
  }
  .preview-query { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .preview-answer { font-size: 14.5px; line-height: 1.6; }

  .voice-dial {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
  }
  .voice-dial:last-child { border-bottom: none; }
  .dial-info { flex: 1; }
  .dial-name { font-weight: 600; font-size: 14px; }
  .dial-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .dial-slider {
    width: 220px; height: 6px;
    background: var(--surface-3); border-radius: 999px;
    position: relative;
    cursor: pointer;
  }
  .dial-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: linear-gradient(90deg, var(--gold-hover), var(--gold));
    border-radius: 999px;
  }
  .dial-thumb {
    position: absolute; top: -6px; width: 18px; height: 18px;
    background: var(--surface); border: 2px solid var(--gold);
    border-radius: 50%; box-shadow: var(--shadow-md);
    transform: translateX(-50%);
    transition: transform var(--transition);
  }
  .dial-thumb:hover { transform: translateX(-50%) scale(1.1); }

  .privacy-card {
    background: linear-gradient(135deg, var(--rose-soft) 0%, #FAECEC 100%);
    border: 1px solid rgba(183, 87, 87, 0.2);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .privacy-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .privacy-title { font-weight: 700; font-size: 15px; color: var(--rose); }
  .toggle {
    width: 42px; height: 24px;
    background: var(--rose);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    transition: background var(--transition);
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; background: #FFF; border-radius: 50%;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition);
  }
  .toggle.off { background: var(--border-strong); }
  .toggle.off::after { right: auto; left: 2px; }
  .privacy-desc { font-size: 13px; color: var(--ink-2); line-height: 1.55; }

  .pinned-message {
    padding: 14px;
    background: var(--surface);
    border-left: 3px solid var(--ink);
    border-radius: 4px;
    font-size: 13.5px; line-height: 1.6;
    font-style: italic;
    color: var(--ink);
  }
  .pinned-message-label {
    font-size: 11px; color: var(--muted); margin-top: 8px;
  }

  .never-share-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .never-share-chip {
    padding: 4px 10px 4px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .never-share-chip::before {
    content: "×"; color: var(--muted-2); font-weight: 700; font-size: 14px;
  }

  .notif-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .notif-row:last-child { border-bottom: none; }
  .notif-toggle {
    width: 34px; height: 20px;
    background: var(--sage);
    border-radius: 999px; position: relative; cursor: pointer;
  }
  .notif-toggle::after {
    content: ""; position: absolute; top: 2px; right: 2px;
    width: 16px; height: 16px; background: #FFF; border-radius: 50%;
    box-shadow: var(--shadow-sm);
  }
  .notif-toggle.off { background: var(--border-strong); }
  .notif-toggle.off::after { right: auto; left: 2px; }

  /* ================================================================ */
  /* SOURCES */
  /* ================================================================ */
  .source-cat { margin-bottom: 32px; }
  .source-cat-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  .source-cat-title {
    font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--ink-2);
  }
  .source-cat-count { font-size: 12px; color: var(--muted); }
  .source-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px;
    transition: all var(--transition);
  }
  .source-card:hover { border-color: var(--border-strong); }
  .source-card-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .source-card-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
  .source-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface-3) 100%);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--ink-2);
    flex-shrink: 0;
  }
  .source-toggle {
    width: 36px; height: 20px;
    background: var(--sage);
    border-radius: 999px; position: relative; cursor: pointer;
    flex-shrink: 0;
  }
  .source-toggle::after {
    content: ""; position: absolute; top: 2px; right: 2px;
    width: 16px; height: 16px; background: #FFF; border-radius: 50%;
    box-shadow: var(--shadow-sm);
  }
  .source-toggle.off { background: var(--border-strong); }
  .source-toggle.off::after { right: auto; left: 2px; }
  .source-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .audience-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
  .audience-cell {
    padding: 6px 4px; text-align: center; font-size: 10.5px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; color: var(--muted); font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
  }
  .audience-cell:hover { background: var(--surface-3); }
  .audience-cell.on { background: var(--ink); color: var(--gold); border-color: var(--ink); font-weight: 600; }

  /* ================================================================ */
  /* HISTORY */
  /* ================================================================ */
  .history-entry {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .history-entry:last-child { border-bottom: none; }
  .history-entry-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 12px;
    gap: 20px;
  }
  .history-who { display: flex; gap: 12px; align-items: flex-start; }
  .history-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .history-role-tag {
    font-size: 10.5px; font-weight: 500;
    padding: 2px 8px; background: var(--surface-2);
    color: var(--muted); border-radius: 4px;
    letter-spacing: 0.3px;
  }
  .history-role-tag.external { background: var(--gold-soft); color: #7A5A1E; }
  .history-question {
    font-size: 13px; color: var(--muted);
    font-style: italic; margin-top: 3px;
  }
  .history-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .history-time { font-size: 12px; color: var(--muted); }
  .history-answer {
    padding: 14px 16px;
    background: var(--surface-2);
    border-left: 3px solid var(--ink);
    border-radius: 4px;
    font-size: 14px; line-height: 1.6;
    margin-bottom: 12px;
  }
  .history-answer.corrected {
    background: linear-gradient(135deg, var(--gold-soft) 0%, #F9EED1 100%);
    border-left-color: var(--gold-hover);
    color: #6B4914;
  }
  .history-sources {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .history-sources-label { margin-right: 4px; }
  .history-actions { display: flex; gap: 6px; }

  /* ================================================================ */
  /* QUICK ADD */
  /* ================================================================ */
  .quick-add-container { max-width: 620px; margin: 0 auto; }
  .capture-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 24px;
  }
  .capture-tab {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 18px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center; cursor: pointer;
    transition: all var(--transition);
  }
  .capture-tab:hover { border-color: var(--border-strong); }
  .capture-tab.active {
    background: var(--ink); border-color: var(--ink); color: #FFF;
    box-shadow: var(--shadow-md);
  }
  .capture-tab.active .capture-icon-lg { color: var(--gold); }
  .capture-tab.active .capture-desc { color: rgba(255,255,255,0.6); }
  .capture-icon-lg {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface-2); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .capture-tab.active .capture-icon-lg { background: rgba(255,255,255,0.1); }
  .capture-label { font-weight: 600; font-size: 14px; }
  .capture-desc { font-size: 11.5px; color: var(--muted); }
  .camera-view {
    position: relative; margin-bottom: 20px;
  }
  .camera-frame {
    background: linear-gradient(135deg, #1F2937 0%, #0F1729 100%);
    border-radius: 12px;
    aspect-ratio: 16/9;
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .camera-focal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 200px; height: 120px;
    border: 2px solid rgba(212, 162, 74, 0.6);
    border-radius: 8px;
    box-shadow: 0 0 0 100vw rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .camera-focal::before, .camera-focal::after,
  .camera-focal > span {
    content: ""; position: absolute; width: 12px; height: 12px;
    border: 2px solid var(--gold);
  }
  .camera-focal::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .camera-focal::after { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .camera-hint {
    color: rgba(255,255,255,0.5); font-size: 12px; position: relative; z-index: 1;
    margin-top: 140px;
  }
  .camera-shutter {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.3), 0 4px 12px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform var(--transition);
  }
  .camera-shutter:hover { transform: translateX(-50%) scale(1.05); }
  .capture-caption {
    padding: 14px 16px;
    background: var(--gold-soft);
    border: 1px solid rgba(212, 162, 74, 0.3);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .capture-caption-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: #7A5A1E; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .capture-caption-text { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .capture-meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .capture-actions {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .audience-quick { display: flex; align-items: center; gap: 6px; }
  .audience-quick-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .audience-quick-chip {
    padding: 4px 10px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); background: var(--surface);
    cursor: pointer;
    transition: all var(--transition);
  }
  .audience-quick-chip.on { background: var(--ink); color: var(--gold); border-color: var(--ink); font-weight: 600; }

  /* ================================================================ */
  /* BOOK TIME */
  /* ================================================================ */
  .book-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .book-person-card {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .book-person-header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .book-context {
    padding: 12px 14px;
    background: var(--gold-soft);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    margin-bottom: 16px;
  }
  .book-context .voice-badge { margin-bottom: 6px; }
  .book-context p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .book-signals { display: flex; flex-direction: column; gap: 4px; }
  .book-signal-row {
    display: flex; justify-content: space-between;
    padding: 6px 0;
    font-size: 12.5px;
  }
  .book-signal-label { color: var(--muted); }
  .book-signal-val { font-weight: 500; }
  .duration-chip {
    display: inline-flex; align-items: center;
    padding: 6px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    transition: all var(--transition);
  }
  .duration-chip:hover { border-color: var(--border-strong); }
  .duration-chip.active {
    background: var(--ink); color: #FFF; border-color: var(--ink);
    font-weight: 600;
  }
  .purpose-draft {
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    font-size: 13.5px; line-height: 1.55;
    font-style: italic;
    color: var(--ink-2);
  }
  .day-label {
    font-size: 12.5px; font-weight: 700;
    color: var(--ink); margin: 14px 0 8px;
  }
  .day-label:first-of-type { margin-top: 0; }
  .time-slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .time-slot {
    padding: 10px 8px; text-align: center; font-size: 13px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .time-slot:hover { border-color: var(--border-strong); }
  .time-slot.recommended {
    background: var(--sage-soft); border-color: rgba(96, 123, 103, 0.3);
    color: var(--sage); font-weight: 600;
    position: relative;
  }
  .time-slot.recommended::before {
    content: "◉"; position: absolute; top: 3px; right: 5px;
    font-size: 7px; color: var(--sage);
  }
  .time-slot.selected {
    background: var(--ink); color: #FFF; border-color: var(--ink);
  }
  .time-slot.selected.recommended::before { color: var(--gold); }

  /* ================================================================ */
  /* MEETING RECAP */
  /* ================================================================ */
  .meeting-header-card {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow-sm);
  }
  .meeting-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
  .ticket-row-hifi {
    display: grid; grid-template-columns: 20px 1fr auto;
    gap: 14px; align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .ticket-row-hifi:last-child { border-bottom: none; }
  .ticket-checkbox {
    width: 20px; height: 20px; border-radius: 5px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    cursor: pointer;
    transition: all var(--transition);
    margin-top: 2px;
    position: relative;
  }
  .ticket-checkbox:hover { border-color: var(--ink); }
  .ticket-checkbox.on {
    background: var(--sage); border-color: var(--sage);
    animation: ticketPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ticket-checkbox.on::after {
    content: ""; position: absolute; left: 5px; top: 1px;
    width: 5px; height: 10px;
    border-right: 2px solid #FFF; border-bottom: 2px solid #FFF;
    transform: rotate(45deg);
  }
  @keyframes ticketPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .ticket-checkbox.on ~ .ticket-content .ticket-title-hifi {
    text-decoration: line-through; color: var(--muted);
  }
  .ticket-content { display: flex; flex-direction: column; gap: 4px; }
  .ticket-title-hifi { font-weight: 500; font-size: 14px; line-height: 1.4; }
  .ticket-meta-hifi { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .dot-sep { color: var(--faint); }
  .ticket-tag {
    padding: 1px 6px; background: var(--surface-2); border-radius: 3px;
    font-size: 11px; color: var(--ink-2); font-weight: 500;
  }
  .ticket-tag.warn { background: var(--gold-soft); color: #7A5A1E; }

  /* ================================================================ */
  /* GOAL DECOMPOSITION */
  /* ================================================================ */
  .goal-directive {
    background: linear-gradient(135deg, var(--surface-2) 0%, #EFEAE0 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .goal-directive-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }
  .goal-directive-text {
    font-size: 15.5px; line-height: 1.65;
    font-style: italic;
    color: var(--ink);
  }
  .goal-response-header {
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .goal-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  .subtask-hifi {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 14px;
    background: var(--surface-2);
    border-radius: 8px;
    margin-bottom: 8px;
    transition: background var(--transition);
  }
  .subtask-hifi:hover { background: var(--surface-3); }
  .subtask-num-hifi {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
    flex-shrink: 0;
  }
  .subtask-text { font-size: 13.5px; line-height: 1.55; padding-top: 3px; }
  .goal-question {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    color: var(--muted);
    font-style: italic;
    display: flex; gap: 8px;
  }
  .goal-question:last-child { border-bottom: none; }
  .goal-question::before {
    content: "?"; color: var(--gold-hover); font-weight: 700; font-style: normal;
    flex-shrink: 0;
  }
  .timeline-item {
    display: grid; grid-template-columns: 90px 1fr;
    gap: 12px; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-day {
    font-weight: 700; color: var(--gold-hover);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .timeline-desc { color: var(--ink-2); }

  /* ================================================================ */
  /* CALENDAR */
  /* ================================================================ */
  .cal-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
  }
  .cal-toolbar-left { display: flex; align-items: center; gap: 10px; }
  .cal-range { font-size: 15px; font-weight: 600; min-width: 160px; text-align: center; }
  .cal-toolbar-right { display: flex; align-items: center; gap: 16px; }
  .cal-legend { display: flex; align-items: center; gap: 12px; }
  .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .cal-dot { width: 8px; height: 8px; border-radius: 50%; }
  .cal-dot.design { background: var(--gold); }
  .cal-dot.backend { background: var(--sage); }
  .cal-dot.question { background: var(--rose); }

  .cal-week {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
  }
  .cal-day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 340px;
    box-shadow: var(--shadow-sm);
  }
  .cal-day.today {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), var(--shadow-md);
  }
  .cal-day-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2);
  }
  .cal-day.today .cal-day-header { background: var(--gold-soft); }
  .cal-day-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .cal-day-num { font-size: 16px; font-weight: 700; }
  .cal-today-pill {
    margin-left: auto;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--ink); background: var(--gold);

  }
  .cal-day-body {
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
    flex: 1;
  }
  .cal-ticket {
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 3px solid var(--gold);
    background: var(--surface-2);
    cursor: pointer;
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .cal-ticket:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .cal-ticket.design { border-left-color: var(--gold); }
  .cal-ticket.backend { border-left-color: var(--sage); }
  .cal-ticket.question { border-left-color: var(--rose); }
  .cal-ticket.coordination { border-left-color: var(--muted-2); }
  .cal-ticket.done { opacity: 0.55; }
  .cal-ticket.done .cal-ticket-title { text-decoration: line-through; }
  .cal-ticket-title { font-size: 12.5px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
  .cal-ticket-meta { font-size: 10.5px; color: var(--muted); }
  .cal-footnote {

    padding: 12px 16px;

  /* ================================================================ */
  /* TICKETS */
  /* ================================================================ */
  .tickets-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 16px;
  }
  .tickets-tabs {
    display: inline-flex; padding: 4px;
